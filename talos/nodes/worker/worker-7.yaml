---
# orange pi 5 plus
apiVersion: v1alpha1
kind: UnattendedInstallConfig
installer:
  image: factory.talos.dev/metal-installer/d8ed49dcbeee6696cfd30619b2ee7f56d982efd66e8283f59170de5af6e78deb:v1.14.5
provisioning:
  diskSelector:
    match: '"/dev/disk/by-id/nvme-Patriot_M.2_P300_256GB_P300IDBB24110706005" in disk.symlinks'
  wipe: false
---
apiVersion: v1alpha1
kind: HostnameConfig
hostname: worker-7
---
# kexec reboots weird on ARM?
apiVersion: v1alpha1
kind: SysctlConfig
params:
  kernel.kexec_load_disabled: "1"
  net.ipv6.conf.vlan40.disable_ipv6: "1" # default/accept_ra=2 would give the node a SLAAC address from the OTBR on VLAN 40
---
apiVersion: v1alpha1
kind: LinkConfig
name: enP4p65s0
addresses:
  - address: 192.168.20.117/24
routes:
  - gateway: 192.168.20.1
---
# IoT VLAN
apiVersion: v1alpha1
kind: VLANConfig
name: vlan40
vlanID: 40
parent: enP4p65s0
---
apiVersion: v1alpha1
kind: KubeNodeConfig
labels:
  network.home.internal/vlan40: "true"
