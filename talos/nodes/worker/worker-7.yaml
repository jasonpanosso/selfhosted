---
# orange pi 5 plus
apiVersion: v1alpha1
kind: UnattendedInstallConfig
installer:
  image: factory.talos.dev/metal-installer/f952ecf3112870c562e82ea90c7ccbb6a1916bd8f8905d7768fc7d54d7e8db27:v1.14.7
provisioning:
  diskSelector:
    match: '"/dev/disk/by-id/nvme-Patriot_M.2_P300_256GB_P300IDBB24110706005" in disk.symlinks'
  wipe: false
---
apiVersion: v1alpha1
kind: HostnameConfig
hostname: worker-7
---
# kexec reboots weird on ARM?
apiVersion: v1alpha1
kind: SysctlConfig
params:
  kernel.kexec_load_disabled: "1"
  net.ipv6.conf.vlan40.disable_ipv6: "1" # default/accept_ra=2 would give the node a SLAAC address from the OTBR on VLAN 40
  net.ipv6.conf.vlan30.disable_ipv6: "1" # VLAN 30 is IPv4-only
---
apiVersion: v1alpha1
kind: LinkConfig
name: enP4p65s0
addresses:
  - address: 192.168.20.117/24
routes:
  - gateway: 192.168.20.1
---
# IoT VLAN
apiVersion: v1alpha1
kind: VLANConfig
name: vlan40
vlanID: 40
parent: enP4p65s0
---
# VPN VLAN
apiVersion: v1alpha1
kind: VLANConfig
name: vlan30
vlanID: 30
parent: enP4p65s0
---
apiVersion: v1alpha1
kind: KubeNodeConfig
labels:
  network.home.internal/vlan40: "true"
  network.home.internal/vlan30: "true"
  storage.home.internal/topolvm: "true"
