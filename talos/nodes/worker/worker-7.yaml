---
# orange pi 5 plus
apiVersion: v1alpha1
kind: UnattendedInstallConfig
installer:
  # bare-metal arm64 + panfrost
  image: factory.talos.dev/metal-installer/9557a43ed46345a996ab0f954bd1f916c0b070d463ea3d7178b5c9732801938a:v1.14.5
provisioning:
  diskSelector:
    match: '"/dev/disk/by-id/nvme-Patriot_M.2_P300_256GB_P300IDBB24110706005" in disk.symlinks'
  wipe: false
---
apiVersion: v1alpha1
kind: HostnameConfig
hostname: worker-7
---
# kexec reboots weird on ARM?
apiVersion: v1alpha1
kind: SysctlConfig
params:
  kernel.kexec_load_disabled: "1"
