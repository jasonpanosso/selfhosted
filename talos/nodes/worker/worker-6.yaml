---
# orange pi 5
apiVersion: v1alpha1
kind: UnattendedInstallConfig
installer:
  # bare-metal arm64 + panfrost
  image: factory.talos.dev/metal-installer/9557a43ed46345a996ab0f954bd1f916c0b070d463ea3d7178b5c9732801938a:v1.14.5
provisioning:
  diskSelector:
    match: '"/dev/disk/by-id/nvme-BC501A_NVMe_SK_hynix_128GB_FD05N9132133Y627H" in disk.symlinks'
  wipe: false
---
apiVersion: v1alpha1
kind: HostnameConfig
hostname: worker-6
---
# kexec reboots weird on ARM?
apiVersion: v1alpha1
kind: SysctlConfig
params:
  kernel.kexec_load_disabled: "1"
---
# inconsistent MAC?
apiVersion: v1alpha1
kind: LinkConfig
name: end0
addresses:
  - address: 192.168.20.116/24
routes:
  - gateway: 192.168.20.1
