---
# Topton N100
apiVersion: v1alpha1
kind: UnattendedInstallConfig
installer:
  image: factory.talos.dev/metal-installer/4b3cd373a192c8469e859b7a0cfbed3ecc3577c4a2d346a37b0aeff9cd17cdb0:v1.14.5
provisioning:
  diskSelector:
    match: '"/dev/disk/by-id/nvme-TEAM_TM8FP6256G_TPBF2408060090100857" in disk.symlinks'
  wipe: false
---
apiVersion: v1alpha1
kind: HostnameConfig
hostname: worker-5
---
apiVersion: v1alpha1
kind: LinkConfig
name: enp3s0
addresses:
  - address: 192.168.20.115/24
routes:
  - gateway: 192.168.20.1
---
# IoT VLAN
apiVersion: v1alpha1
kind: VLANConfig
name: vlan40
vlanID: 40
parent: enp3s0
---
# VPN VLAN
apiVersion: v1alpha1
kind: VLANConfig
name: vlan30
vlanID: 30
parent: enp3s0
---
apiVersion: v1alpha1
kind: SysctlConfig
params:
  net.ipv6.conf.vlan40.disable_ipv6: "1" # default/accept_ra=2 would give the node a SLAAC address from the OTBR on VLAN 40
  net.ipv6.conf.vlan30.disable_ipv6: "1" # VLAN 30 is IPv4-only
---
apiVersion: v1alpha1
kind: KubeNodeConfig
labels:
  network.home.internal/vlan40: "true"
  network.home.internal/vlan30: "true"
  storage.home.internal/topolvm: "true"
