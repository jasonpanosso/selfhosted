---
apiVersion: v1alpha1
kind: KubeletConfig
image: ghcr.io/siderolabs/kubelet:v1.36.6
defaultRuntimeSeccompProfileEnabled: true
config:
  serializeImagePulls: false
---
apiVersion: v1alpha1
kind: KubeClusterConfig
clusterName: prod
endpoint: https://192.168.20.100:6443
---
apiVersion: v1alpha1
kind: ResolverConfig
nameservers:
  - address: 192.168.20.1
searchDomains:
  domains:
    - kubernetes.internal
    - home.internal
hostDNS:
  enabled: true
  forwardKubeDNSToHost: false
  resolveMemberNames: true
---
apiVersion: v1alpha1
kind: CRICustomizationConfig
name: discard-unpacked-layers
content: |
  [plugins."io.containerd.cri.v1.images"]
    discard_unpacked_layers = false
---
apiVersion: v1alpha1
kind: KubeFlannelCNIConfig
$patch: delete
---
apiVersion: v1alpha1
kind: HostnameConfig
$patch: delete
---
apiVersion: v1alpha1
kind: SecurityProfileConfig
workloadIsolation: true
---
# no nosuid/nodev
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
mount:
  secure: false
---
apiVersion: v1alpha1
kind: FilesystemTrimConfig
interval: 168h0m0s
