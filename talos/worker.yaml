---
apiVersion: v1alpha1
kind: KubeletConfig
config:
  imageGCHighThresholdPercent: 65
  imageGCLowThresholdPercent: 55
  # remove unused images older than 30 days
  imageMaximumGCAge: 720h
---
# local-path-provisioner storage; a directory on /var, mounted without nosuid/nodev/noexec like /var itself
apiVersion: v1alpha1
kind: UserVolumeConfig
name: local-path-provisioner
volumeType: directory
mount:
  secure: false
