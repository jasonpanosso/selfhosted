---
machine:
  kubelet:
    extraMounts:
      - destination: /var/local-path-provisioner
        type: bind
        source: /var/local-path-provisioner
        options:
          - bind
          - rshared
          - rw
      - destination: /var/lib/rook
        type: bind
        source: /var/lib/rook
        options:
          - bind
          - rshared
          - rw
    extraConfig:
      imageGCHighThresholdPercent: 65
      imageGCLowThresholdPercent: 55
      # remove unused images older than 30 days
      imageMaximumGCAge: 720h
