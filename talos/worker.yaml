---
machine:
  kubelet:
    extraMounts:
      - destination: /var/local-path-provisioner
        type: bind
        source: /var/local-path-provisioner
        options:
          - bind
          - rshared
          - rw
      - destination: /var/lib/rook
        type: bind
        source: /var/lib/rook
        options:
          - bind
          - rshared
          - rw
    extraConfig:
      imageGCHighThresholdPercent: 65
      imageGCLowThresholdPercent: 55
      # remove unused images older than 30 days
      imageMaximumGCAge: 720h
---
# local-path-provisioner storage; a directory on /var, mounted without nosuid/nodev/noexec like /var itself
apiVersion: v1alpha1
kind: UserVolumeConfig
name: local-path-provisioner
volumeType: directory
mount:
  secure: false
