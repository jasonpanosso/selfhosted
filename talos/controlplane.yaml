---
cluster:
  apiServer:
    image: registry.k8s.io/kube-apiserver:v1.37.2
    certSANs:
      - 192.168.20.100
    admissionControl:
      - name: PodSecurity
        configuration:
          defaults:
            audit: privileged
            audit-version: latest
            enforce: privileged
            enforce-version: latest
            warn: privileged
            warn-version: latest
    extraArgs:
      feature-gates: MutatingAdmissionPolicy=true,ImageVolume=true
      runtime-config: admissionregistration.k8s.io/v1beta1=true
  controllerManager:
    image: registry.k8s.io/kube-controller-manager:v1.37.2
    extraArgs:
      bind-address: 0.0.0.0
  scheduler:
    image: registry.k8s.io/kube-scheduler:v1.37.2
    extraArgs:
      bind-address: 0.0.0.0
    config:
      apiVersion: kubescheduler.config.k8s.io/v1
      kind: KubeSchedulerConfiguration
      profiles:
        - schedulerName: default-scheduler
          plugins:
            score:
              disabled:
                - name: ImageLocality
          pluginConfig:
            - name: PodTopologySpread
              args:
                defaultingType: List
                defaultConstraints:
                  - maxSkew: 1
                    topologyKey: kubernetes.io/hostname
                    whenUnsatisfiable: ScheduleAnyway
  coreDNS:
    disabled: true
  etcd:
    extraArgs:
      listen-metrics-urls: http://0.0.0.0:2381
    advertisedSubnets:
      - 192.168.20.0/24
  proxy:
    image: registry.k8s.io/kube-proxy:v1.37.2 # disabled in common.yaml; pinned so the rendered config has no generated image
---
apiVersion: v1alpha1
kind: DHCPv4Config
name: enp1s0
---
apiVersion: v1alpha1
kind: Layer2VIPConfig
name: 192.168.20.100
link: enp1s0
