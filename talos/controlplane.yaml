---
# no standalone document for this yet in 1.14
machine:
  features:
    # lets talos-backup's talos.dev ServiceAccount take etcd snapshots
    kubernetesTalosAPIAccess:
      enabled: true
      allowedRoles:
        - os:etcd:backup
      allowedKubernetesNamespaces:
        - kube-system
cluster:
  etcd:
    extraArgs:
      listen-metrics-urls: http://0.0.0.0:2381
    advertisedSubnets:
      - 192.168.20.0/24
---
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: kube-apiserver
portSelector:
  ports:
    - 6443
  protocol: tcp
ingress:
  # do not allow IPv6, kubeprism is mean
  - subnet: 192.168.20.0/24
  - subnet: 10.244.0.0/16
  # admin network
  - subnet: 192.168.1.0/24
---
# talos-backup takes etcd snapshots through the talos.default Service
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: apid-pods
portSelector:
  ports:
    - 50000
  protocol: tcp
ingress:
  - subnet: 10.244.0.0/16
---
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: trustd
portSelector:
  ports:
    - 50001
  protocol: tcp
ingress:
  - subnet: 192.168.20.0/24
---
# 2379 client, 2380 peer, 2383 client HTTP; etcd only advertises IPv4
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: etcd
portSelector:
  ports:
    - 2379-2380
    - 2383
  protocol: tcp
ingress:
  - subnet: 192.168.20.101/32
  - subnet: 192.168.20.102/32
  - subnet: 192.168.20.103/32
---
# etcd, kube-controller-manager and kube-scheduler metrics
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: controlplane-metrics
portSelector:
  ports:
    - 2381
    - 10257
    - 10259
  protocol: tcp
ingress:
  - subnet: 192.168.20.0/24
  - subnet: 10.244.0.0/16
---
apiVersion: v1alpha1
kind: KubeAPIServerConfig
image: registry.k8s.io/kube-apiserver:v1.36.6
certExtraSANs:
  - 192.168.20.100
---
apiVersion: v1alpha1
kind: KubeAdmissionControlConfig
name: PodSecurity
configuration:
  defaults:
    audit: restricted
    audit-version: latest
    enforce: restricted
    enforce-version: latest
    warn: restricted
    warn-version: latest
---
apiVersion: v1alpha1
kind: KubeControllerManagerConfig
image: registry.k8s.io/kube-controller-manager:v1.36.6
extraArgs:
  bind-address: 0.0.0.0
  terminated-pod-gc-threshold: "10"
---
apiVersion: v1alpha1
kind: KubeSchedulerConfig
image: registry.k8s.io/kube-scheduler:v1.36.6
extraArgs:
  bind-address: 0.0.0.0
config:
  apiVersion: kubescheduler.config.k8s.io/v1
  kind: KubeSchedulerConfiguration
  profiles:
    - schedulerName: default-scheduler
      plugins:
        score:
          disabled:
            - name: ImageLocality
      pluginConfig:
        - name: PodTopologySpread
          args:
            defaultingType: List
            defaultConstraints:
              - maxSkew: 1
                topologyKey: kubernetes.io/hostname
                whenUnsatisfiable: ScheduleAnyway
---
# cilium replaces kube-proxy; image pinned so the rendered config has no generated image
apiVersion: v1alpha1
kind: KubeProxyConfig
enabled: false
image: registry.k8s.io/kube-proxy:v1.36.6
---
apiVersion: v1alpha1
kind: KubeCoreDNSConfig
enabled: false
---
apiVersion: v1alpha1
kind: Layer2VIPConfig
name: 192.168.20.100
link: enp1s0
