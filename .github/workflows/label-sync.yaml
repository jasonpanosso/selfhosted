---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Label Sync

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths: [".github/labels.yaml"]
  schedule:
    - cron: "0 0 * * *" # daily at midnight

permissions:
  contents: read

jobs:
  main:
    name: Label Sync - Sync Labels
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/labels.yaml

      # labels.yaml is the full set: creates or updates every label in it, deletes the rest
      - name: Sync Labels
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -o pipefail
          yq -r '.[] | [.name, .color, .description // ""] | @tsv' .github/labels.yaml \
            | while IFS=$'\t' read -r name color description; do
                gh label create "$name" --color "$color" --description "$description" --force
              done

          # an empty or unreadable file must not delete every label
          wanted=$(yq -r '.[].name' .github/labels.yaml)
          test -n "$wanted"
          existing=$(gh label list --limit 1000 --json name --jq '.[].name')
          comm -13 <(sort <<< "$wanted") <(sort <<< "$existing") \
            | while read -r name; do
                gh label delete "$name" --yes
              done
