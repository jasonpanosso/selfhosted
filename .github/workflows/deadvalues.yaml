---
name: deadvalues

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  filter:
    name: deadvalues - Filter
    runs-on: ubuntu-latest
    outputs:
      changed-files: ${{ steps.changed-files.outputs.changed_files }}
    steps:
      - name: Get Changed Files
        id: changed-files
        uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
        with:
          patterns: |
            .deadvalues.yaml
            .github/workflows/deadvalues.yaml
            kubernetes/**/*

  check:
    if: ${{ needs.filter.outputs.changed-files != '[]' }}
    needs: filter
    name: deadvalues - Check
    runs-on: ubuntu-latest
    steps:
      # The action diffs against the PR base, so it needs full history
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      # Diffs chart bumps (fails on BREAKING) and scans changed apps (reports
      # only). Pinned to a SHA the action installs the latest release, so
      # version is set explicitly.
      - name: Run deadvalues
        uses: guarnz/deadvalues@6ed0a88f1513ea7c3c93b3bb9a4b4fc71b951b25 # v0.1.9
        with:
          path: kubernetes
          # renovate: datasource=github-releases depName=guarnz/deadvalues
          version: v0.1.9
          github-token: ${{ steps.app-token.outputs.token }}
