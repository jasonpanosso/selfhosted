---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: nixfmt

on:
  pull_request:
    branches: ["main"]
    paths:
      - flake.nix
      - .github/workflows/nixfmt.yaml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fix:
    name: nixfmt - Fix
    runs-on: ubuntu-latest
    # Renovate branches only: formats flake.nix and pushes the result back to the PR
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'renovate/') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "${{ github.head_ref }}"
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0

      - name: Run nixfmt
        run: nix fmt flake.nix

      - name: Check for Changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - if: ${{ steps.changes.outputs.changed == 'true' }}
        name: Generate Token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app-token
        with:
          client-id: "${{ secrets.BOT_CLIENT_ID }}"
          private-key: "${{ secrets.BOT_APP_PRIVATE_KEY }}"
          permission-contents: write

      - if: ${{ steps.changes.outputs.changed == 'true' }}
        name: Push Changes
        env:
          TOKEN: "${{ steps.app-token.outputs.token }}"
          HEAD_REF: "${{ github.head_ref }}"
        run: |
          git config user.name "bot-syl[bot]"
          git config user.email "213080625+bot-syl[bot]@users.noreply.github.com"
          git -c core.hooksPath=/dev/null commit --no-verify -am "style: nixfmt flake.nix"
          git -c core.hooksPath=/dev/null push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${HEAD_REF}"
