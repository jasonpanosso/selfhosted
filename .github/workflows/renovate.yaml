---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Renovate

on:
  push:
    branches: ["main"]
    paths:
      - .renovaterc.json
      - .renovate/**.json
  schedule:
    - cron: "0 * * * *" # hourly
  workflow_dispatch:
    inputs:
      dryRun:
        description: Dry Run
        type: boolean
        default: false
        required: true
      logLevel:
        description: Log Level
        type: choice
        default: debug
        options:
          - debug
          - info
        required: true
      version:
        description: Renovate Version (blank uses the pinned version)
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=renovatebot/renovate
  PINNED_RENOVATE_VERSION: 44.257.6

jobs:
  main:
    name: Renovate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0

      # for scripts/talos-initcall-blacklist.sh
      - name: Build crane
        id: crane
        run: echo "path=$(nix build .#crane --no-link --print-out-paths)/bin/crane" >> "$GITHUB_OUTPUT"

      - name: Generate Token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app-token
        with:
          client-id: "${{ secrets.BOT_CLIENT_ID }}"
          private-key: "${{ secrets.BOT_APP_PRIVATE_KEY }}"
          # branches, commits and branch automerge to main
          permission-contents: write
          # Dependency Dashboard and config-error issues
          permission-issues: write
          # PRs and their labels
          permission-pull-requests: write
          # renovate/stability-days and other commit statuses
          permission-statuses: write
          # updates to .github/workflows (action digests, PINNED_RENOVATE_VERSION)
          permission-workflows: write

      - name: Run Renovate
        uses: renovatebot/github-action@acdd6bda8b035c99ce59d5675816af2aa65a1774 # v46.3.14
        env:
          LOG_LEVEL: "${{ inputs.logLevel || 'debug' }}"
          RENOVATE_AUTODISCOVER: true
          RENOVATE_AUTODISCOVER_FILTER: "${{ github.repository }}"
          RENOVATE_ALLOWED_COMMANDS: '["^bash scripts/flake-hashes\\.sh$", "^bash scripts/talos-initcall-blacklist\\.sh [a-z0-9-]+ (amd64|arm64)$"]'
          RENOVATE_DRY_RUN: "${{ inputs.dryRun }}"
          RENOVATE_INTERNAL_CHECKS_FILTER: strict
          RENOVATE_PLATFORM: github
          RENOVATE_PLATFORM_COMMIT: enabled
        with:
          token: "${{ steps.app-token.outputs.token }}"
          renovate-version: "${{ inputs.version || env.PINNED_RENOVATE_VERSION }}"
          # /tmp:/tmp is the action's default, replaced by setting this
          docker-volumes: "/tmp:/tmp;/nix/store:/nix/store:ro;${{ steps.crane.outputs.path }}:/usr/local/bin/crane:ro"
