---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: kubeconform

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/kubeconform.yaml
      - flake.lock
      - flake.nix
      - kubernetes/**

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: kubeconform - Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0

      - name: Install kubeconform
        run: echo "$(nix build .#kubeconform --no-link --print-out-paths)/bin" >> "$GITHUB_PATH"

      # fill in postBuild substitutions
      - name: Fill Flux Substitutions
        run: |
          # shellcheck disable=SC2016 # literal ${...}, not expansions
          find kubernetes -name '*.yaml' -exec sed -i 's/\${domain}/example/g; s/\${tld}/com/g' {} +

      - name: Run kubeconform
        run: |
          kubeconform -strict -summary -output text \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -skip Kustomization/kustomize.config.k8s.io/v1beta1,Component/kustomize.config.k8s.io/v1alpha1 \
            -ignore-filename-pattern '\.sops\.yaml$' \
            -ignore-filename-pattern '/resources/' \
            -ignore-filename-pattern 'kustomizeconfig\.yaml$' \
            kubernetes
