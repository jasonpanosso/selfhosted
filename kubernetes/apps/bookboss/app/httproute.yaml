---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: &app bookboss
  labels:
    app.kubernetes.io/name: *app
spec:
  parentRefs:
    - name: cilium
      namespace: kube-system
      sectionName: https
  hostnames:
    - books.${domain}.${tld}
  rules:
    # opds & koreader clients can't do forward auth; strip identity headers so they can't be spoofed
    - matches:
        - path:
            type: PathPrefix
            value: /opds
        - path:
            type: PathPrefix
            value: /koreader
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - Remote-User
              - Remote-Name
              - Remote-Groups
              - Remote-Email
      backendRefs:
        - name: *app
          port: 8080
    - filters:
        - type: ExternalAuth
          externalAuth:
            protocol: HTTP
            backendRef:
              name: authelia
              namespace: auth
              port: 80
            http:
              # trailing slash is required: envoy appends the original path (with its leading slash)
              path: /api/authz/ext-authz/
              allowedHeaders:
                - accept
                - cookie
                - proxy-authorization
                - x-forwarded-for
                - x-forwarded-proto
                - x-requested-with
              allowedResponseHeaders:
                - Remote-User
                - Remote-Name
                - Remote-Groups
                - Remote-Email
      backendRefs:
        - name: *app
          port: 8080
