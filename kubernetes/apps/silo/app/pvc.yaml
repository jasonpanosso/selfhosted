---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/persistentvolumeclaim-v1.json
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: silo
spec:
  accessModes: [ReadWriteOncePod]
  resources:
    requests:
      storage: 10Gi
  storageClassName: rook-ceph-block
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/persistentvolume-v1.json
apiVersion: v1
kind: PersistentVolume
metadata:
  name: media-silo
spec:
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 3500Gi
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - context=system_u:object_r:ephemeral_t:s0
  claimRef:
    namespace: silo
    name: media
  csi:
    driver: rook-ceph.cephfs.csi.ceph.com
    volumeHandle: media-silo
    nodeStageSecretRef:
      name: rook-csi-cephfs-node
      namespace: rook-ceph
    volumeAttributes:
      clusterID: rook-ceph
      fsName: mediafs
      staticVolume: "true"
      rootPath: /
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/persistentvolumeclaim-v1.json
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: media
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 3500Gi
  storageClassName: ""
  volumeName: media-silo
