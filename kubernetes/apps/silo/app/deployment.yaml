---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/deployment-apps-v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: &app silo
  labels:
    app.kubernetes.io/name: *app
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  # above the startupProbe budget
  progressDeadlineSeconds: 1500
  # Silo bug causes multiple API replicas without sticky sessions to start
  # transcoding on the api server (lol)
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: *app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: *app
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        sysctls:
          # get rid of startup warning
          - name: net.ipv4.tcp_wmem
            value: "4096 16384 67108864"
      affinity:
        # plugin binaries are installed for the platform of the API server that installed them and
        # restored from the database as-is: these are x86-64, so an arm64 pod can't run them
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values:
                      - amd64
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - silo
                topologyKey: kubernetes.io/hostname
      containers:
        - image: ghcr.io/silo-server/silo-server:build-2872@sha256:caf474ef4c857b60b0d10b641772d6afc23bb3c7c236c2c1174d385e8b654ff6
          name: *app
          # do not use bundled init, run binary directly
          command: [silo]
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 8096
              name: jellyfin
          env:
            - name: DATABASE_URL_FILE
              value: /run/secrets/silo/database_url
            - name: SECRET_KEY_FILE
              value: /run/secrets/silo/secret_key
            - name: REDIS_URL_FILE
              value: /run/secrets/silo/redis_url
            - name: SILO_ARTWORK_STORAGE
              value: s3
            - name: SILO_S3_PUBLIC_ENDPOINT
              value: https://s3.${domain}.${tld}
            - name: SILO_S3_PUBLIC_REGION
              value: us-east-1
            - name: SILO_S3_PUBLIC_BUCKET
              value: silo-public
            - name: SILO_S3_PUBLIC_PATH_STYLE
              value: "true"
            - name: SILO_S3_PUBLIC_URL_AUTH
              value: presigned
            - name: SILO_S3_PUBLIC_ACCESS_KEY_FILE
              value: /run/secrets/silo/s3_public_access_key
            - name: SILO_S3_PUBLIC_SECRET_KEY_FILE
              value: /run/secrets/silo/s3_public_secret_key
            - name: SILO_S3_PRIVATE_ENDPOINT
              value: https://s3.${domain}.${tld}
            - name: SILO_S3_PRIVATE_REGION
              value: us-east-1
            - name: SILO_S3_PRIVATE_BUCKET
              value: silo-private
            - name: SILO_S3_PRIVATE_PATH_STYLE
              value: "true"
            - name: SILO_S3_PRIVATE_ACCESS_KEY_FILE
              value: /run/secrets/silo/s3_private_access_key
            - name: SILO_S3_PRIVATE_SECRET_KEY_FILE
              value: /run/secrets/silo/s3_private_secret_key
            - name: SILO_PUBLIC_URL
              value: https://silo.${domain}.${tld}
            # plugins and AI providers
            - name: SILO_CONFIG_FILE
              value: /run/silo-config/config.yaml
            - name: SILO_TRANSCODE_NODES_FILE
              value: /run/silo-config/transcode-nodes.yaml
            - name: SILO_JELLYFIN_PUBLIC_URL
              value: https://silo-jellyfin.${domain}.${tld}
            - name: SILO_AUDIOBOOKSHELF_ENABLED
              value: "false"
            - name: SILO_SIGNUP_ENABLED
              value: "false"
            # UDP discovery doesn't cross the gateway
            - name: SILO_LAN_DISCOVERY
              value: "false"
            - name: SILO_LOG_FORMAT
              value: json
            # no GPU on the API pods
            - name: SILO_HW_ACCEL
              value: none
            # cilium-envoy on the pod's own node connects from the node IP, envoy on any other
            # node from that node's ingress IP in the pod CIDR.
            - name: SILO_TRUSTED_PROXIES
              value: 192.168.20.0/24,10.244.0.0/16
            - name: SILO_DB_MAX_CONNECTIONS
              value: "10"
            - name: SILO_SCANNER_WORKERS
              value: "4"
            - name: SILO_MATCHER_WORKERS
              value: "4"
            # forcing a larger send buffer needs NET_ADMIN, keep kernel autotuning
            - name: SILO_NET_TCP_SEND_BUFFER
              value: "off"
            - name: SILO_SEARCH_PROVIDER
              value: meilisearch
            - name: SILO_MEILISEARCH_URL
              value: http://meilisearch.silo.svc.cluster.local:7700
            - name: SILO_MEILISEARCH_API_KEY_FILE
              value: /run/secrets/silo/meilisearch_api_key
            - name: SILO_MEILISEARCH_INDEX
              value: silo_media_items
            - name: SILO_RECOMMENDATIONS_ENABLED
              value: "true"
            - name: SILO_SMTP_ENABLED
              value: "true"
            - name: SILO_SMTP_HOST
              value: smtp.resend.com
            - name: SILO_SMTP_PORT
              value: "587"
            - name: SILO_SMTP_SECURITY
              value: starttls
            - name: SILO_SMTP_USER
              value: resend
            - name: SILO_SMTP_PASSWORD_FILE
              value: /run/secrets/silo/resend_api_key
            - name: SILO_SMTP_FROM_ADDRESS
              value: silo@notify.jasonpanosso.com
            - name: SILO_SMTP_FROM_NAME
              value: Silo
            # the ai_providers id in config.yaml
            - name: SILO_RECOMMENDATIONS_PROVIDER
              value: openrouter-002b54
            - name: SILO_RECOMMENDATIONS_MODEL
              value: baai/bge-m3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            failureThreshold: 5
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 5
          # migrations run before the listener answers
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            periodSeconds: 10
            failureThreshold: 120
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: media
              mountPath: /media/movies
              subPath: movies
              readOnly: true
            - name: media
              mountPath: /media/shows
              subPath: shows
              readOnly: true
            # /var/lib/silo is a symlink to /config/silo in the image. nothing to keep: artwork is in S3,
            # plugin binaries are restored from the database
            - name: config
              mountPath: /config/silo
            # transcode segments, prepared downloads, and the plugin binary cache
            - name: tmp
              mountPath: /tmp
            - name: silo-config
              mountPath: /run/silo-config
              readOnly: true
            - name: secrets
              mountPath: /run/secrets/silo
              readOnly: true
      volumes:
        - name: silo-config
          configMap:
            name: silo-config
        # every secret silo reads, through the *_FILE variables and the config documents' fromFile
        - name: secrets
          projected:
            sources:
              - secret:
                  name: silo
                  items:
                    - key: DATABASE_URL
                      path: database_url
                    - key: SILO_SECRET_KEY
                      path: secret_key
                    - key: REDIS_URL
                      path: redis_url
                    - key: SILO_MEILISEARCH_MASTER_KEY
                      path: meilisearch_api_key
                    - key: SILO_OIDC_PASSWORD
                      path: oidc_client_secret
                    - key: SILO_THEINTRODB_API_KEY
                      path: theintrodb_api_key
                    - key: SILO_OPENROUTER_API_KEY
                      path: openrouter_api_key
                    - key: RESEND_API_KEY
                      path: resend_api_key
              # every transcode node's key, one file per pod name (transcode-nodes.yaml)
              - secret:
                  name: silo-transcode
              - secret:
                  name: silo-public
                  items:
                    - key: AWS_ACCESS_KEY_ID
                      path: s3_public_access_key
                    - key: AWS_SECRET_ACCESS_KEY
                      path: s3_public_secret_key
              - secret:
                  name: silo-private
                  items:
                    - key: AWS_ACCESS_KEY_ID
                      path: s3_private_access_key
                    - key: AWS_SECRET_ACCESS_KEY
                      path: s3_private_secret_key
        - name: media
          persistentVolumeClaim:
            claimName: media
        - name: config
          emptyDir:
            sizeLimit: 1Gi
        - name: tmp
          emptyDir:
            sizeLimit: 30Gi
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/deployment-apps-v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: &app meilisearch
  labels:
    app.kubernetes.io/name: *app
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  # a second pod would start with an empty index and split silo's rebuild across both
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: *app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: *app
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - image: docker.io/getmeili/meilisearch:v1.57.0@sha256:91bf09897482c17205c8faeca8daa8d57999fb9de20d862763cdfa92ba4ec790
          name: *app
          # skip the image's tini + sh wrapper, meilisearch handles SIGTERM itself
          command: [/bin/meilisearch]
          ports:
            - containerPort: 7700
              name: http
          env:
            # requires a master key and keeps the search preview UI off
            - name: MEILI_ENV
              value: production
            - name: MEILI_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: meilisearch
                  key: MEILI_MASTER_KEY
            - name: MEILI_HTTP_ADDR
              value: 0.0.0.0:7700
            - name: MEILI_DB_PATH
              value: /meili_data/data.ms
            - name: MEILI_NO_ANALYTICS
              value: "true"
            # the default budget is 2/3 of the memory meilisearch detects, which can be the node's
            # rather than the container limit. 128 MiB
            - name: MEILI_MAX_INDEXING_MEMORY
              value: "134217728"
            - name: MEILI_MAX_INDEXING_THREADS
              value: "1"
          livenessProbe:
            httpGet:
              path: /health
              port: 7700
            failureThreshold: 5
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 7700
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /meili_data
            - name: tmp
              mountPath: /tmp
      volumes:
        # use emptyDir, let silo rebuild to avoid migration/upgrading bs
        - name: data
          emptyDir:
            sizeLimit: 1Gi
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
