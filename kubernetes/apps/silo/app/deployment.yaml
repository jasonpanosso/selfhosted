---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/deployment-apps-v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: &app silo
  labels:
    app.kubernetes.io/name: *app
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  # above the startupProbe budget
  progressDeadlineSeconds: 1500
  # Silo bug causes multiple API replicas without sticky sessions to start
  # transcoding on the api server (lol)
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: *app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: *app
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        sysctls:
          # get rid of startup warning
          - name: net.ipv4.tcp_wmem
            value: "4096 16384 67108864"
      affinity:
        # plugin binaries are installed for the platform of the API server that installed them and
        # restored from the database as-is: these are x86-64, so an arm64 pod can't run them
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values:
                      - amd64
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - silo
                topologyKey: kubernetes.io/hostname
      containers:
        - image: ghcr.io/silo-server/silo-server:build-2619@sha256:41f439cb545acf7d8cfb6216759822e97f97007338e3bc3bd132a3b848d9b0a9
          name: *app
          # do not use bundled init, run binary directly
          command: [silo]
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 8096
              name: jellyfin
          env:
            - name: SILO_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: silo
                  key: SILO_DB_USERNAME
            - name: SILO_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: silo
                  key: SILO_DB_PASSWORD
            - name: DATABASE_URL
              value: postgres://$(SILO_DB_USERNAME):$(SILO_DB_PASSWORD)@pgcluster-rw.db.svc.cluster.local:5432/silo?sslmode=require
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: silo
                  key: SILO_SECRET_KEY
            - name: SILO_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: silo
                  key: SILO_REDIS_PASSWORD
            - name: REDIS_URL
              value: redis://:$(SILO_REDIS_PASSWORD)@dragonfly.silo.svc.cluster.local:6379/0
            - name: SILO_ARTWORK_STORAGE
              value: s3
            - name: SILO_S3_PUBLIC_ENDPOINT
              value: https://s3.home.${domain}.${tld}
            - name: SILO_S3_PUBLIC_REGION
              value: us-east-1
            - name: SILO_S3_PUBLIC_BUCKET
              value: silo-public
            - name: SILO_S3_PUBLIC_PATH_STYLE
              value: "true"
            - name: SILO_S3_PUBLIC_URL_AUTH
              value: presigned
            - name: SILO_S3_PUBLIC_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: silo-public
                  key: AWS_ACCESS_KEY_ID
            - name: SILO_S3_PUBLIC_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: silo-public
                  key: AWS_SECRET_ACCESS_KEY
            - name: SILO_S3_PRIVATE_ENDPOINT
              value: https://s3.home.${domain}.${tld}
            - name: SILO_S3_PRIVATE_REGION
              value: us-east-1
            - name: SILO_S3_PRIVATE_BUCKET
              value: silo-private
            - name: SILO_S3_PRIVATE_PATH_STYLE
              value: "true"
            - name: SILO_S3_PRIVATE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: silo-private
                  key: AWS_ACCESS_KEY_ID
            - name: SILO_S3_PRIVATE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: silo-private
                  key: AWS_SECRET_ACCESS_KEY
            - name: SILO_PUBLIC_URL
              value: https://silo.home.${domain}.${tld}
            - name: SILO_PLUGINS_FILE
              value: /run/silo-provisioning/plugins.yaml
            - name: SILO_JELLYFIN_ENABLED
              value: "true"
            - name: SILO_JELLYFIN_PUBLIC_URL
              value: https://silo-jellyfin.home.${domain}.${tld}
            - name: SILO_AUDIOBOOKSHELF_ENABLED
              value: "false"
            - name: SILO_SIGNUP_ENABLED
              value: "false"
            # UDP discovery doesn't cross the gateway
            - name: SILO_LAN_DISCOVERY
              value: "false"
            - name: SILO_LOG_FORMAT
              value: json
            # no GPU on the API pods
            - name: SILO_HW_ACCEL
              value: none
            # cilium-envoy on the pod's own node connects from the node IP, envoy on any other
            # node from that node's ingress IP in the pod CIDR.
            - name: SILO_TRUSTED_PROXIES
              value: 192.168.20.0/24,10.244.0.0/16
            - name: SILO_DB_MAX_CONNECTIONS
              value: "10"
            - name: SILO_SCANNER_WORKERS
              value: "4"
            - name: SILO_MATCHER_WORKERS
              value: "4"
            # forcing a larger send buffer needs NET_ADMIN, keep kernel autotuning
            - name: SILO_NET_TCP_SEND_BUFFER
              value: "off"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            failureThreshold: 5
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 5
          # migrations run before the listener answers
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            periodSeconds: 10
            failureThreshold: 120
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: media
              mountPath: /media/movies
              subPath: movies
              readOnly: true
            - name: media
              mountPath: /media/shows
              subPath: shows
              readOnly: true
            # /var/lib/silo is a symlink to /config/silo in the image. nothing to keep: artwork is in S3,
            # plugin binaries are restored from the database
            - name: config
              mountPath: /config/silo
            # transcode segments, prepared downloads, and the plugin binary cache
            - name: tmp
              mountPath: /tmp
            - name: plugins
              mountPath: /run/silo-provisioning
              readOnly: true
            - name: plugin-secrets
              mountPath: /run/secrets/silo
              readOnly: true
      volumes:
        - name: plugins
          configMap:
            name: silo-plugins
        - name: plugin-secrets
          secret:
            secretName: silo
            items:
              - key: SILO_OIDC_PASSWORD
                path: oidc_client_secret
        - name: media
          persistentVolumeClaim:
            claimName: media
        - name: config
          emptyDir:
            sizeLimit: 1Gi
        - name: tmp
          emptyDir:
            sizeLimit: 30Gi
