---
# yaml-language-server: $schema=https://raw.githubusercontent.com/Silo-Server/silo-server/main/contracts/plugins/provisioning/v1/schema.json
apiVersion: 1
plugins:
  silo.auth.oidc:
    config:
      connection:
        issuer_url: https://auth.${domain}.${tld}
        client_id: silo
        client_secret:
          fromFile: /run/secrets/silo/oidc_client_secret
        # authelia only sends groups when asked for the scope
        request_groups_scope: true
      access:
        allowed_groups: admins
        admin_groups: admins
    auth_binding:
      capability_id: oidc
      enabled: true
      auto_provision: true
      # /api/v2/auth/oauth/callback instead of the installation id route
      callback: stable
  silo.autoscan.arr: {}
