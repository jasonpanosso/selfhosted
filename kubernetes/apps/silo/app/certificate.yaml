---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cert-manager.io/certificate_v1.json
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: silo
spec:
  secretName: silo-tls
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  commonName: silo.home.${domain}.${tld}
  dnsNames:
    - silo.home.${domain}.${tld}
    - silo-jellyfin.home.${domain}.${tld}
