---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: silo
spec:
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  refreshPolicy: Periodic
  refreshInterval: 1h
  data:
    - secretKey: SILO_DB_USERNAME
      remoteRef:
        key: SILO_DB_USERNAME
    - secretKey: SILO_DB_PASSWORD
      remoteRef:
        key: SILO_DB_PASSWORD
    - secretKey: SILO_SECRET_KEY
      remoteRef:
        key: SILO_SECRET_KEY
    - secretKey: SILO_REDIS_PASSWORD
      remoteRef:
        key: SILO_REDIS_PASSWORD
    - secretKey: SILO_OIDC_PASSWORD
      remoteRef:
        key: SILO_OIDC_PASSWORD
    - secretKey: SILO_MEILISEARCH_MASTER_KEY
      remoteRef:
        key: SILO_MEILISEARCH_MASTER_KEY
    - secretKey: SILO_THEINTRODB_API_KEY
      remoteRef:
        key: SILO_THEINTRODB_API_KEY
    - secretKey: RESEND_API_KEY
      remoteRef:
        key: RESEND_API_KEY
    - secretKey: SILO_OPENROUTER_API_KEY
      remoteRef:
        key: SILO_OPENROUTER_API_KEY
  target:
    name: silo
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        DATABASE_URL: "postgres://{{ .SILO_DB_USERNAME }}:{{ .SILO_DB_PASSWORD }}@pgcluster-rw.db.svc.cluster.local:5432/silo?sslmode=require"
        REDIS_URL: "redis://:{{ .SILO_REDIS_PASSWORD }}@dragonfly.silo.svc.cluster.local:6379/0"
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: silo-transcode
spec:
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  refreshPolicy: Periodic
  refreshInterval: 1h
  data:
    # one per transcode node
    - secretKey: silo-transcode-0
      remoteRef:
        key: SILO_TRANSCODE_0_NODE_KEY
    - secretKey: silo-transcode-1
      remoteRef:
        key: SILO_TRANSCODE_1_NODE_KEY
  target:
    name: silo-transcode
    creationPolicy: Owner
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: meilisearch
spec:
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  refreshPolicy: Periodic
  refreshInterval: 1h
  data:
    - secretKey: MEILI_MASTER_KEY
      remoteRef:
        key: SILO_MEILISEARCH_MASTER_KEY
  target:
    name: meilisearch
    creationPolicy: Owner
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dragonfly
spec:
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  refreshPolicy: Periodic
  refreshInterval: 1h
  data:
    - secretKey: DRAGONFLY_PASSWORD
      remoteRef:
        key: SILO_REDIS_PASSWORD
  target:
    name: dragonfly
    creationPolicy: Owner
