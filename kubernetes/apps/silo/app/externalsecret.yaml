---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: silo
spec:
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  refreshPolicy: Periodic
  refreshInterval: 1h
  data:
    - secretKey: SILO_DB_USERNAME
      remoteRef:
        key: SILO_DB_USERNAME
    - secretKey: SILO_DB_PASSWORD
      remoteRef:
        key: SILO_DB_PASSWORD
    - secretKey: SILO_SECRET_KEY
      remoteRef:
        key: SILO_SECRET_KEY
    - secretKey: SILO_REDIS_PASSWORD
      remoteRef:
        key: SILO_REDIS_PASSWORD
  target:
    name: silo
    creationPolicy: Owner
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: silo-transcode
spec:
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  refreshPolicy: Periodic
  refreshInterval: 1h
  data:
    - secretKey: SILO_NODE_KEY
      remoteRef:
        key: SILO_NODE_KEY
  target:
    name: silo-transcode
    creationPolicy: Owner
