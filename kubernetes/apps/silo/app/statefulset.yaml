---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/statefulset-apps-v1.json
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: &app silo-transcode
  labels:
    app.kubernetes.io/name: *app
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 2
  serviceName: *app
  selector:
    matchLabels:
      app.kubernetes.io/name: *app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: *app
    spec:
      automountServiceAccountToken: false
      # above SILO_NODE_DRAIN_TIMEOUT plus a minute for shutdown
      terminationGracePeriodSeconds: 660
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: silo-gpu
      containers:
        - image: ghcr.io/silo-server/silo-server:build-2872@sha256:caf474ef4c857b60b0d10b641772d6afc23bb3c7c236c2c1174d385e8b654ff6
          name: *app
          # do not use bundled init, run binary directly
          command: [silo]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: MODE
              value: transcode
            - name: SILO_CORE_URL
              value: http://silo.silo.svc.cluster.local
            - name: SILO_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SILO_NODE_URL
              value: http://$(SILO_NODE_NAME).silo-transcode.silo.svc.cluster.local:8080
            - name: SILO_NODE_KEY_FILE
              value: /run/secrets/silo/$(SILO_NODE_NAME)
            - name: SILO_NODE_GROUP
              value: kubernetes
            - name: SILO_NODE_SOURCE_ACCESS
              value: local
            - name: SILO_NODE_HW_ACCEL
              value: qsv
            - name: SILO_NODE_HW_DEVICE
              value: /dev/dri/renderD128
            - name: SILO_NODE_DRAIN_TIMEOUT
              value: 10m
            # hdd volume for biggly downloads kept off of ephemeral
            - name: SILO_NODE_DOWNLOAD_ARTIFACT_DIR
              value: /var/cache/silo-downloads
            # 80 GiB of the 100Gi volume
            - name: SILO_NODE_DOWNLOAD_ARTIFACT_MAX_BYTES
              value: "85899345920"
          # answers 200 while draining, so a draining node is not restarted
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            failureThreshold: 5
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 5
          # the listener opens after the first configuration read from the API succeeds
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            periodSeconds: 10
            failureThreshold: 60
          resources:
            requests:
              cpu: 100m
              memory: 768Mi
            limits:
              memory: 768Mi
            claims:
              - name: gpu
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: media
              mountPath: /media/movies
              subPath: movies
              readOnly: true
            - name: media
              mountPath: /media/shows
              subPath: shows
              readOnly: true
            - name: media
              mountPath: /media/audiobooks
              subPath: audiobooks
              readOnly: true
            # transcode segments
            - name: tmp
              mountPath: /tmp
            - name: downloads
              mountPath: /var/cache/silo-downloads
            - name: secrets
              mountPath: /run/secrets/silo
              readOnly: true
      volumes:
        # every node's key, one file per pod name
        - name: secrets
          secret:
            secretName: silo-transcode
        - name: media
          persistentVolumeClaim:
            claimName: media
        - name: tmp
          emptyDir:
            sizeLimit: 30Gi
  volumeClaimTemplates:
    - metadata:
        name: downloads
      spec:
        accessModes: [ReadWriteOncePod]
        storageClassName: rook-ceph-block-hdd
        resources:
          requests:
            storage: 100Gi
