---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/cronjob-batch-v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mam-seedbox-ip
spec:
  schedule: 0 * * * *
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      # a failed update is retried by the next hourly run
      backoffLimit: 0
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: mam
          annotations:
            k8s.v1.cni.cncf.io/networks: |-
              [{"name": "vpn", "namespace": "kube-system", "interface": "net1", "ips": ["192.168.30.12/24"], "mac": "02:00:00:00:30:12"}]
        spec:
          automountServiceAccountToken: false
          nodeSelector:
            network.home.internal/vlan30: "true"
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            fsGroupChangePolicy: OnRootMismatch
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: mam
              image: docker.io/curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
              command: [/bin/sh, /scripts/mam.sh, ip]
              envFrom:
                - secretRef:
                    name: mam
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 32Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: scripts
                  mountPath: /scripts
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: mam
            - name: scripts
              configMap:
                name: mam
          restartPolicy: Never
---
