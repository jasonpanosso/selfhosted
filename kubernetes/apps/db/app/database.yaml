kind: Database
metadata:
  name: silo
spec:
  name: silo
  owner: silo
  cluster:
    name: pgcluster
  # pgvector isn't a trusted extension, so the silo role can't create it.
  # silo's first migration runs CREATE EXTENSION IF NOT EXISTS and finds it here
  extensions:
    - name: vector
      ensure: present
