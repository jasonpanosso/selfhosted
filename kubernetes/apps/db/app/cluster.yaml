---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pgcluster
spec:
  bootstrap:
    recovery:
      source: source
  externalClusters:
    - name: source
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: b2-store
          serverName: pgcluster-pg18
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-minimal-trixie@sha256:c8caac9817d2b5e5e66297a3ccf86d9fcbd68f097aa6cc00161d83f9635e88cc
  postgresql:
    extensions:
      # for silo
      - name: pgvector
        image:
          reference: ghcr.io/cloudnative-pg/pgvector:0.8.7-18-trixie@sha256:eef3dd247157d53acc8e6ac53b5b610474eaedcd93f722c89245a3171b58e10f
  instances: 3
  primaryUpdateMethod: switchover
  priorityClassName: system-cluster-critical
  affinity:
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      memory: 1Gi
  storage:
    size: 10Gi
    storageClass: topolvm
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: b2-store
        serverName: pgcluster-pg18
  managed:
    roles:
      - name: authelia
        ensure: present
        passwordSecret:
          name: authelia-db
        login: true
      - name: lldap
        ensure: present
        login: true
        passwordSecret:
          name: lldap-db
      - name: radarr
        ensure: present
        passwordSecret:
          name: radarr-db
        login: true
      - name: sonarr
        ensure: present
        login: true
        passwordSecret:
          name: sonarr-db
      - name: prowlarr
        ensure: present
        login: true
        passwordSecret:
          name: prowlarr-db
      - name: autobrr
        ensure: present
        login: true
        passwordSecret:
          name: autobrr-db
      - name: qui
        ensure: present
        login: true
        passwordSecret:
          name: qui-db
      - name: bookboss
        ensure: present
        login: true
        passwordSecret:
          name: bookboss-db
      - name: tandoor
        ensure: present
        login: true
        passwordSecret:
          name: tandoor-db
      - name: silo
        ensure: present
        login: true
        passwordSecret:
          name: silo-db
