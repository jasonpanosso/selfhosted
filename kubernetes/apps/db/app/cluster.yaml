---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pgcluster
spec:
  bootstrap:
    recovery:
      source: source
  externalClusters:
    - name: source
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: b2-store
          serverName: pgcluster-pg18
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-minimal-trixie@sha256:452a15584e2aa1ce658c4ae8538b5dc157eb031d41b82fd19882e0c03bcec01d
  postgresql:
    extensions:
      # for silo
      - name: pgvector
        image:
          reference: ghcr.io/cloudnative-pg/pgvector:0.8.7-18-trixie@sha256:8c719f4ba8796a39b1e08a450b424577be9fd9821089dfd2c90e8c2d86b7a03c
  instances: 3
  primaryUpdateMethod: switchover
  priorityClassName: system-cluster-critical
  affinity:
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      memory: 1Gi
  storage:
    size: 10Gi
    storageClass: topolvm
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: b2-store
        serverName: pgcluster-pg18
  managed:
    roles:
      - name: authelia
        ensure: present
        passwordSecret:
          name: authelia-db
        login: true
      - name: lldap
        ensure: present
        login: true
        passwordSecret:
          name: lldap-db
      - name: radarr
        ensure: present
        passwordSecret:
          name: radarr-db
        login: true
      - name: sonarr
        ensure: present
        login: true
        passwordSecret:
          name: sonarr-db
      - name: prowlarr
        ensure: present
        login: true
        passwordSecret:
          name: prowlarr-db
      - name: seerr
        ensure: present
        login: true
        passwordSecret:
          name: seerr-db
      - name: autobrr
        ensure: present
        login: true
        passwordSecret:
          name: autobrr-db
      - name: qui
        ensure: present
        login: true
        passwordSecret:
          name: qui-db
      - name: bookboss
        ensure: present
        login: true
        passwordSecret:
          name: bookboss-db
      - name: tandoor
        ensure: present
        login: true
        passwordSecret:
          name: tandoor-db
      - name: silo
        ensure: present
        login: true
        passwordSecret:
          name: silo-db
