---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pgcluster
  annotations:
    # https://github.com/cloudnative-pg/cloudnative-pg/issues/5778#issuecomment-2782198691
    cnpg.io/skipEmptyWalArchiveCheck: "enabled"
spec:
  bootstrap:
    recovery:
      source: source
  externalClusters:
    - name: source
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: b2-store
          serverName: pgcluster-pg18
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:39add80f5b1e573e2f6b641c66fd1a2f8dede67ca0330e870285bc1078551390
  instances: 3
  storage:
    size: 20Gi
    storageClass: local-path
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: b2-store
        serverName: pgcluster-pg18
  managed:
    roles:
      - name: authelia
        ensure: present
        passwordSecret:
          name: authelia-db
        login: true
      - name: lldap
        ensure: present
        login: true
        passwordSecret:
          name: lldap-db
      - name: radarr
        ensure: present
        passwordSecret:
          name: radarr-db
        login: true
      - name: sonarr
        ensure: present
        login: true
        passwordSecret:
          name: sonarr-db
      - name: prowlarr
        ensure: present
        login: true
        passwordSecret:
          name: prowlarr-db
      - name: jellyfin
        ensure: present
        login: true
        passwordSecret:
          name: jellyfin-db
      - name: seerr
        ensure: present
        login: true
        passwordSecret:
          name: seerr-db
      - name: autobrr
        ensure: present
        login: true
        passwordSecret:
          name: autobrr-db
      - name: qui
        ensure: present
        login: true
        passwordSecret:
          name: qui-db
      - name: bookboss
        ensure: present
        login: true
        passwordSecret:
          name: bookboss-db
      - name: tandoor
        ensure: present
        login: true
        passwordSecret:
          name: tandoor-db
