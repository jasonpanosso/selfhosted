---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kopiur
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kopiur
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    # admission webhooks, failurePolicy
    - fromEntities:
        - kube-apiserver
      toPorts: &webhook
        - ports:
            - port: "8443"
              protocol: TCP
    - fromNodes:
        - matchLabels:
            node-role.kubernetes.io/control-plane: ""
      toPorts: *webhook
    # metrics
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: vmagent
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
            - port: "8443"
              protocol: TCP
