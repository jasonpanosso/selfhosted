---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kopiur-extra
spec:
  groups:
    - name: kopiur-extra.rules
      rules:
        - alert: KopiurControllerAbsent
          expr: |-
            absent(up{job="kopiur-controller-metrics"} == 1)
          annotations:
            summary: >-
              Kopiur controller has disappeared from Prometheus target discovery
          for: 5m
          labels:
            severity: critical

        # no per-object labels, just a rough count
        - alert: KopiurReplicationFailed
          expr: |-
            sum(increase(kopiur_replication_runs_total{outcome!="succeeded"}[1h])) > 0
          annotations:
            summary: >-
              An offsite RepositoryReplication run failed; check `kubectl get repositoryreplication -A`
          labels:
            severity: warning

        # 1 RepositoryReplication per repo per day
        - alert: KopiurReplicationStale
          expr: |-
            (sum(increase(kopiur_replication_runs_total{outcome="succeeded"}[24h])) or vector(0))
              < count(kopiur_resource_phase{kind="Repository"})
          for: 2h
          annotations:
            summary: >-
              Only {{ $value }} offsite replications succeeded in the last 24h; check `kubectl get repositoryreplication -A` for an old LAST
          labels:
            severity: warning

        - alert: KopiurRepositoryVolumeFilling
          expr: |-
            last_over_time(
              (max by (namespace, persistentvolumeclaim) (kubelet_volume_stats_used_bytes{persistentvolumeclaim=~"kopiur-.+"}))[7d:1m]
            )
              / on (namespace, persistentvolumeclaim)
            max by (namespace, persistentvolumeclaim) (kube_persistentvolumeclaim_resource_requests_storage_bytes{persistentvolumeclaim=~"kopiur-.+"})
              > 0.8
          for: 1h
          annotations:
            summary: >-
              {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} was {{ $value | humanizePercentage }} full at its last kubelet sample
          labels:
            severity: warning

        # Quick verification runs daily, so a verify older than two days means
        # verification stopped succeeding or stopped running. Individual failed
        # quick/deep runs surface sooner through KubeJobFailed.
        - alert: KopiurVerificationStale
          expr: |-
            time() - kopiur_snapshot_verified_timestamp_seconds > 2 * 86400
          annotations:
            summary: >-
              {{ $labels.namespace }}/{{ $labels.name }} has not verified successfully in over 2 days
          for: 1h
          labels:
            severity: warning
