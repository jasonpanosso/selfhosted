---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app kopiur-repositories
  namespace: &namespace kopiur-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/kopiur-system/repositories/app
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  prune: true
  wait: false
  healthChecks:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSet
      name: *app
      namespace: *namespace
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSet
      name: kopiur-minecraft
      namespace: *namespace
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  dependsOn:
    - name: kopiur
      namespace: *namespace
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: secret-store
      namespace: external-secrets
