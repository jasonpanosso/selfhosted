---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/talos.dev/serviceaccount_v1alpha1.json
# Talos mints a Secret of the same name holding a talosconfig limited to these roles.
# Needs machine.features.kubernetesTalosAPIAccess in talos/controlplane.yaml.
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: talos-backup
spec:
  roles:
    - os:etcd:backup
