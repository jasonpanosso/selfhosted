---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone/cronjob-batch-v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: &app talos-backup
spec:
  # daily, between the CNPG base backup (00:00) and Kopiur's offsite replication (~03:00)
  schedule: 0 2 * * *
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: *app
        spec:
          automountServiceAccountToken: false
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: *app
              image: ghcr.io/siderolabs/talos-backup:v0.1.0@sha256:3635df0be0862d71bba7a34dca3e7f7c790887f5c5d0129002191c4c2d92dd15
              command: ["/talos-backup"]
              workingDir: /tmp
              env:
                - name: CLUSTER_NAME
                  value: prod
                - name: AWS_REGION
                  value: us-east-005
                - name: CUSTOM_S3_ENDPOINT
                  value: https://s3.us-east-005.backblazeb2.com
                - name: BUCKET
                  value: selfhosted-backups-cbb55f9e
                - name: S3_PREFIX
                  value: talos-backup
                # decrypt with the sops-age key
                - name: AGE_RECIPIENT_PUBLIC_KEY
                  value: age1ukrrt44dctfz6krhl5ynjtm2w6vt7jk20057gz7g2s7nervrxeqqd57cdf
              envFrom:
                - secretRef:
                    name: talos-backup-s3
              resources:
                requests:
                  cpu: 10m
                  memory: 128Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: talos
                  mountPath: /var/run/secrets/talos.dev
                  readOnly: true
          volumes:
            - name: tmp
              emptyDir: {}
            - name: talos
              secret:
                secretName: talos-backup
          restartPolicy: OnFailure
