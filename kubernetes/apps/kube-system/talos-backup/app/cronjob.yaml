---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone/cronjob-batch-v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: &app talos-backup
spec:
  # daily, between the CNPG base backup (00:00) and Kopiur's offsite replication (~03:00)
  schedule: 0 2 * * *
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: *app
              image: ghcr.io/siderolabs/talos-backup:v0.1.0-beta.3@sha256:05c86663b251a407551dc948097e32e163a345818117eb52c573b0447bd0c7a7
              command: ["/talos-backup"]
              workingDir: /tmp
              env:
                - name: CLUSTER_NAME
                  value: prod
                - name: AWS_REGION
                  value: nyc3
                - name: CUSTOM_S3_ENDPOINT
                  value: https://${s3_backup_domain_name}
                - name: BUCKET
                  value: ${s3_backup_bucket_name}
                - name: S3_PREFIX
                  value: talos-backup
                - name: USE_PATH_STYLE
                  value: "false"
                # decrypt with the sops-age key
                - name: AGE_X25519_PUBLIC_KEY
                  value: age1ukrrt44dctfz6krhl5ynjtm2w6vt7jk20057gz7g2s7nervrxeqqd57cdf
              envFrom:
                - secretRef:
                    name: talos-backup-s3
              resources:
                requests:
                  cpu: 10m
                  memory: 128Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: talos
                  mountPath: /var/run/secrets/talos.dev
                  readOnly: true
          volumes:
            - name: tmp
              emptyDir: {}
            - name: talos
              secret:
                secretName: talos-backup
          restartPolicy: OnFailure
