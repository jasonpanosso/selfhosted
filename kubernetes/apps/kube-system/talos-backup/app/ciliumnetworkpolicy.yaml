---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: talos-backup
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: talos-backup
  enableDefaultDeny:
    ingress: true
    egress: true
  egress:
    - toNodes:
        - matchLabels:
            node-role.kubernetes.io/control-plane: ""
      toPorts:
        - ports:
            - port: "50000"
              protocol: TCP
    # toFQDNs only learns IPs from DNS that goes through the proxy
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # B2 upload
    - toFQDNs:
        - matchName: s3.us-east-005.backblazeb2.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
