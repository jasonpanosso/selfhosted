---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/k8s.cni.cncf.io/networkattachmentdefinition_v1.json
# VPN VLAN
# pods pick their own IP/MAC in the networks annotation.
# Router routes all vlan30 traffic through wireguard
# routes: all public IPv4 (0.0.0.0/0 minus RFC1918) goes out net1; cluster, LAN and DNS stay on eth0's default route
# mtu must match configured wg0 on router
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: vpn
spec:
  config: |-
    {
      "cniVersion": "1.0.0",
      "name": "vpn",
      "plugins": [
        {
          "type": "macvlan",
          "master": "vlan30",
          "mode": "bridge",
          "mtu": 1320,
          "ipam": {
            "type": "static",
            "routes": [
              { "dst": "0.0.0.0/5", "gw": "192.168.30.1" },
              { "dst": "8.0.0.0/7", "gw": "192.168.30.1" },
              { "dst": "11.0.0.0/8", "gw": "192.168.30.1" },
              { "dst": "12.0.0.0/6", "gw": "192.168.30.1" },
              { "dst": "16.0.0.0/4", "gw": "192.168.30.1" },
              { "dst": "32.0.0.0/3", "gw": "192.168.30.1" },
              { "dst": "64.0.0.0/2", "gw": "192.168.30.1" },
              { "dst": "128.0.0.0/3", "gw": "192.168.30.1" },
              { "dst": "160.0.0.0/5", "gw": "192.168.30.1" },
              { "dst": "168.0.0.0/6", "gw": "192.168.30.1" },
              { "dst": "172.0.0.0/12", "gw": "192.168.30.1" },
              { "dst": "172.32.0.0/11", "gw": "192.168.30.1" },
              { "dst": "172.64.0.0/10", "gw": "192.168.30.1" },
              { "dst": "172.128.0.0/9", "gw": "192.168.30.1" },
              { "dst": "173.0.0.0/8", "gw": "192.168.30.1" },
              { "dst": "174.0.0.0/7", "gw": "192.168.30.1" },
              { "dst": "176.0.0.0/4", "gw": "192.168.30.1" },
              { "dst": "192.0.0.0/9", "gw": "192.168.30.1" },
              { "dst": "192.128.0.0/11", "gw": "192.168.30.1" },
              { "dst": "192.160.0.0/13", "gw": "192.168.30.1" },
              { "dst": "192.169.0.0/16", "gw": "192.168.30.1" },
              { "dst": "192.170.0.0/15", "gw": "192.168.30.1" },
              { "dst": "192.172.0.0/14", "gw": "192.168.30.1" },
              { "dst": "192.176.0.0/12", "gw": "192.168.30.1" },
              { "dst": "192.192.0.0/10", "gw": "192.168.30.1" },
              { "dst": "193.0.0.0/8", "gw": "192.168.30.1" },
              { "dst": "194.0.0.0/7", "gw": "192.168.30.1" },
              { "dst": "196.0.0.0/6", "gw": "192.168.30.1" },
              { "dst": "200.0.0.0/5", "gw": "192.168.30.1" },
              { "dst": "208.0.0.0/4", "gw": "192.168.30.1" },
              { "dst": "224.0.0.0/3", "gw": "192.168.30.1" }
            ]
          },
          "capabilities": { "ips": true, "mac": true }
        },
        {
          "type": "tuning",
          "sysctl": {
            "net.ipv6.conf.net1.disable_ipv6": "1"
          }
        }
      ]
    }
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/k8s.cni.cncf.io/networkattachmentdefinition_v1.json
# IoT VLAN with the OTBR, no internet
# pods pick their own IP/MAC in the networks annotation. IPv4 is on-link only (no routes)
# sysctls:
# - accept_ra_rt_info_max_plen=64 installs the OTBR's route to the Thread /64 from its RA route information option
# - accept_ra_defrtr=0 keeps the default route on eth0
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: iot
spec:
  config: |-
    {
      "cniVersion": "1.0.0",
      "name": "iot",
      "plugins": [
        {
          "type": "macvlan",
          "master": "vlan40",
          "mode": "bridge",
          "ipam": { "type": "static" },
          "capabilities": { "ips": true, "mac": true }
        },
        {
          "type": "tuning",
          "sysctl": {
            "net.ipv6.conf.net1.accept_ra": "2",
            "net.ipv6.conf.net1.accept_ra_rt_info_max_plen": "64",
            "net.ipv6.conf.net1.accept_ra_defrtr": "0"
          }
        }
      ]
    }
