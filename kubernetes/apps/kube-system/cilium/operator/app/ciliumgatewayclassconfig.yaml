---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumgatewayclassconfig_v2alpha1.json
apiVersion: cilium.io/v2alpha1
kind: CiliumGatewayClassConfig
metadata:
  name: cilium-lb
spec:
  service:
    type: LoadBalancer
    externalTrafficPolicy: Cluster
    # Cilium serves the LB IPs in eBPF
    allocateLoadBalancerNodePorts: false
