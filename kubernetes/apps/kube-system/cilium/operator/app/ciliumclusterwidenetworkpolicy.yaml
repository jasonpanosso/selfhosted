---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: baseline
spec:
  # allows every pod needs; adds to each namespace's own policy and never puts a pod into default deny
  endpointSelector: {}
  enableDefaultDeny:
    egress: false
    ingress: false
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    # controlplane nodes aren't considered a "kube-apiserver entity" while restarting. use node label
    - toNodes:
        - matchLabels:
            node-role.kubernetes.io/control-plane: ""
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
  ingress:
    # metrics ports differ per app
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
          matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
                - prometheus
                - vmagent
