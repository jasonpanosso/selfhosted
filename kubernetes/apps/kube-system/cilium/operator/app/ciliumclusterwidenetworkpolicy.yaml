---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: baseline
spec:
  # allows every pod needs; adds to each namespace's own policy and never puts a pod into default deny
  endpointSelector: {}
  enableDefaultDeny:
    egress: false
    ingress: false
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    # controlplane nodes aren't considered a "kube-apiserver entity" while restarting. use node label
    - toNodes:
        - matchLabels:
            node-role.kubernetes.io/control-plane: ""
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
  ingress:
    # allow normal ICMP traffic from stale connections
    - fromEntities:
        - all
      icmps:
        - fields:
            - type: EchoRequest
              family: IPv4
            - type: DestinationUnreachable
              family: IPv4
            - type: TimeExceeded
              family: IPv4
            - type: ParameterProblem
              family: IPv4
    # metrics ports differ per app
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: vmagent
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: cilium-health
spec:
  # one health endpoint per node; only answers probes from cilium agents
  endpointSelector:
    matchLabels:
      reserved:health: ""
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "4240"
              protocol: TCP
    - fromEntities:
        - host
        - remote-node
      icmps:
        - fields:
            - type: EchoRequest
              family: IPv4
