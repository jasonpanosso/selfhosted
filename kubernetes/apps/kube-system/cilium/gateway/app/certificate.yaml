---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cert-manager.io/certificate_v1.json
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard
spec:
  secretName: wildcard-tls
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  commonName: ${domain}.${tld}
  dnsNames:
    - ${domain}.${tld}
    - "*.${domain}.${tld}"
    # minecraft rcon consoles, one level below each server's hostname
    - rcon.botc.${domain}.${tld}
    - rcon.cobblemon.${domain}.${tld}
    - rcon.sunlit-valley.${domain}.${tld}
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cert-manager.io/certificate_v1.json
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-home
spec:
  secretName: wildcard-home-tls
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  commonName: home.${domain}.${tld}
  dnsNames: ["home.${domain}.${tld}", "*.home.${domain}.${tld}"]
