---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httpsredirect
  annotations:
    # no hostnames, so external-dns would publish the listener's *.${domain}.${tld} as a wildcard record
    external-dns.kubernetes.io/controller: none
spec:
  parentRefs:
    - name: cilium
      namespace: kube-system
      sectionName: http
    - name: cilium-internal
      namespace: kube-system
      sectionName: http
  rules:
    - filters:
        - requestRedirect:
            scheme: https
            statusCode: 301
          type: RequestRedirect
