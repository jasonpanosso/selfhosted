---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httpsredirect
  annotations:
    # no hostnames, external-dns would publish the listener's hostname for it
    external-dns.kubernetes.io/controller: none
spec:
  parentRefs:
    - name: cilium-public
      namespace: kube-system
      sectionName: http
    - name: cilium-internal
      namespace: kube-system
      sectionName: http
  rules:
    - filters:
        - requestRedirect:
            scheme: https
            statusCode: 301
          type: RequestRedirect
