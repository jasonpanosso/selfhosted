---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: victoria-metrics-operator
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: victoria-metrics-operator
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    # kubelet health probes
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
    # admission webhook, failurePolicy: Ignore
    - fromEntities:
        - kube-apiserver
      toPorts: &webhook
        - ports:
            - port: "9443"
              protocol: TCP
    - fromNodes:
        - matchLabels:
            node-role.kubernetes.io/control-plane: ""
      toPorts: *webhook
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vmsingle
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: vmsingle
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    # cilium gateway envoy
    - fromEntities:
        - ingress
      toPorts: &http
        - ports:
            - port: "8428"
              protocol: TCP
    # kubelet health probes
    - fromEntities:
        - host
      toPorts: *http
    # remote write from vmagent and vmalert, queries from vmalert and grafana
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: vmagent
        - matchLabels:
            app.kubernetes.io/name: vmalert
        - matchLabels:
            app.kubernetes.io/name: grafana
      toPorts: *http
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vmalert
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: vmalert
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    # kubelet health probes for vmalert and config-reloader
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            - port: "8435"
              protocol: TCP
  egress:
    # datasource, remoteRead and remoteWrite
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: vmsingle
      toPorts:
        - ports:
            - port: "8428"
              protocol: TCP
    # notifier
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: vmalertmanager
      toPorts:
        - ports:
            - port: "9093"
              protocol: TCP
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vmalertmanager
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: vmalertmanager
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    # cilium gateway envoy
    - fromEntities:
        - ingress
      toPorts: &web
        - ports:
            - port: "9093"
              protocol: TCP
    # kubelet health probes for alertmanager and config-reloader
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "9093"
              protocol: TCP
            - port: "8435"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: vmalert
        # datasource in grafana's helmrelease.yaml
        - matchLabels:
            app.kubernetes.io/name: grafana
        - matchLabels:
            app.kubernetes.io/name: silence-operator
        # flux alerts
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: flux-system
            app: notification-controller
      toPorts: *web
  egress:
    # toFQDNs only learns IPs from DNS that goes through the proxy
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # pushover receivers and the heartbeat webhook in vmalertmanagerconfig.yaml
    - toFQDNs:
        - matchName: api.pushover.net
        - matchName: hc-ping.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: sync-job
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: victoria-metrics-k8s-stack
  enableDefaultDeny:
    ingress: true
    egress: true
  egress:
    # toFQDNs only learns IPs from DNS that goes through the proxy
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # syncJob fetches upstream rules and dashboards on each chart upgrade
    - toFQDNs:
        - matchName: raw.githubusercontent.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vmagent
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: vmagent
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    # kubelet health probes for vmagent and config-reloader
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8429"
              protocol: TCP
            - port: "8435"
              protocol: TCP
  egress:
    # scrape targets and remote write. cluster covers every pod plus host-network targets on
    # node IPs (kubelet, node-exporter, cilium, control plane) via host, remote-node and
    # kube-apiserver. no ports listed so new scrape targets work without a policy change
    - toEntities:
        - cluster
