---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app victoria-metrics-k8s-stack
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  upgrade:
    strategy:
      name: RemediateOnFailure
    remediation:
      remediateLastFailure: true
      retries: 2
  values:
    fullnameOverride: victoria-metrics

    victoria-metrics-operator:
      enabled: true
      fullnameOverride: victoria-metrics-operator
      crds:
        plain: true
        # do not delete crds on uninstall
        cleanup:
          enabled: false
      podSecurityContext:
        enabled: true
        fsGroup: 2000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi
      operator:
        disable_prometheus_converter: false
        # delete converted VM objects when the prometheus-operator object they came from is deleted
        enable_converter_ownership: true

    # handled in their own charts
    prometheus-node-exporter:
      enabled: false
    kube-state-metrics:
      enabled: false

    kubelet:
      enabled: true
    kubeApiServer:
      enabled: true
    kubeControllerManager:
      enabled: true
      vmScrape:
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: http-metrics
              scheme: https
              # talos serves a self-signed certificate
              tlsConfig:
                insecureSkipVerify: true
    kubeDns:
      enabled: false
    coreDns:
      enabled: true
    kubeEtcd:
      enabled: true
      service:
        port: 2381
        targetPort: 2381
        # talos runs etcd as a system service, not a pod; kube-apiserver pods run on the same nodes
        selector:
          component: kube-apiserver
      vmScrape:
        spec:
          endpoints:
            - port: http-metrics
              scheme: http
    kubeScheduler:
      enabled: true
      vmScrape:
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: http-metrics
              scheme: https
              # talos serves a self-signed certificate
              tlsConfig:
                insecureSkipVerify: true
    kubeProxy:
      enabled: false

    grafana:
      enabled: false
      forceDeployDatasource: false
      sidecar:
        dashboards:
          label: grafana_dashboard
          labelValue: "1"

    # used by the sync-job to point fetched dashboards at a datasource uid
    defaultDatasources:
      victoriametrics:
        datasources:
          - name: VictoriaMetrics
            type: prometheus
            uid: victoriametrics
            isDefault: true

    external:
      grafana:
        host: https://grafana.${domain}.${tld}
        datasource: VictoriaMetrics

    syncJob:
      enabled: true
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL

    defaultDashboards:
      enabled: true
      annotations:
        grafana_folder: VictoriaMetrics
      sources:
        # node-exporter is a standalone HelmRelease, so the chart can't tie this to its subchart
        node-exporter-full:
          enabled: true
      # from the kube-prometheus source: no windows nodes and no prometheus
      dashboards:
        k8s-resources-windows-cluster:
          enabled: false
        k8s-resources-windows-namespace:
          enabled: false
        k8s-resources-windows-pod:
          enabled: false
        k8s-windows-cluster-rsrc-use:
          enabled: false
        k8s-windows-node-rsrc-use:
          enabled: false
        prometheus:
          enabled: false
        prometheus-remote-write:
          enabled: false

    defaultRules:
      enabled: true
      sources:
        # exporters are standalone HelmReleases, so the chart can't tie these to its subcharts
        kube-state-metrics:
          enabled: true
        node-exporter:
          enabled: true
      rules:
        # fires for count:up0, which is empty whenever no target is down
        RecordingRulesNoData:
          enabled: false

    vmsingle:
      enabled: true
      spec:
        useStrictSecurity: true
        retentionPeriod: 10d
        resources:
          requests:
            cpu: 250m
            memory: 2Gi
          limits:
            memory: 2Gi
        storage:
          storageClassName: rook-ceph-block
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi

    vmagent:
      enabled: true
      spec:
        useStrictSecurity: true
        scrapeInterval: 30s
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            memory: 512Mi

    vmalert:
      enabled: true
      spec:
        useStrictSecurity: true
        evaluationInterval: 30s
        extraArgs:
          http.pathPrefix: /
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 256Mi

    alertmanager:
      enabled: true
      spec:
        useStrictSecurity: true
        externalURL: https://alerts.${domain}.${tld}
        # vmalertmanagerconfig.yaml routes alerts from every namespace
        disableNamespaceMatcher: true
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
          limits:
            memory: 128Mi
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: rook-ceph-block
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 1Gi
