---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app victoria-metrics-k8s-stack
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  upgrade:
    strategy:
      name: RemediateOnFailure
    remediation:
      remediateLastFailure: true
      retries: 2
  values:
    fullnameOverride: victoria-metrics

    victoria-metrics-operator:
      enabled: true
      fullnameOverride: victoria-metrics-operator
      crds:
        plain: true
        # do not delete crds on uninstall
        cleanup:
          enabled: false
      podSecurityContext:
        enabled: true
        fsGroup: 2000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi
      operator:
        disable_prometheus_converter: false
        # delete converted VM objects when the prometheus-operator object they came from is deleted
        enable_converter_ownership: true

    # handled in their own charts
    prometheus-node-exporter:
      enabled: false
    kube-state-metrics:
      enabled: false

    # TODO: managed by kube-prometheus stack
    kubelet:
      enabled: false
    kubeApiServer:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeDns:
      enabled: false
    coreDns:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false

    grafana:
      enabled: false
      forceDeployDatasource: false
      sidecar:
        dashboards:
          label: grafana_dashboard
          labelValue: "1"

    # used by the sync-job to point fetched dashboards at a datasource uid
    defaultDatasources:
      victoriametrics:
        datasources:
          - name: VictoriaMetrics
            type: prometheus
            uid: victoriametrics
            isDefault: true

    external:
      grafana:
        host: https://grafana.${domain}.${tld}
        datasource: VictoriaMetrics

    syncJob:
      enabled: true
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL

    defaultDashboards:
      enabled: true
      annotations:
        grafana_folder: VictoriaMetrics
      # TODO: enable when kube-prometheus-stack does not manage
      sources:
        kubernetes-views-global:
          enabled: false
        kubernetes-views-namespaces:
          enabled: false
        kubernetes-views-pods:
          enabled: false
        kubernetes-views-nodes:
          enabled: false
        kubernetes-system-api-server:
          enabled: false
        kubernetes-system-coredns:
          enabled: false
        kube-prometheus:
          enabled: false

    defaultRules:
      enabled: true
      # TODO: enable when kube-prometheus-stack does not manage
      sources:
        kubernetes-control-plane:
          enabled: false
        kubernetes:
          enabled: false

    vmsingle:
      enabled: true
      spec:
        useStrictSecurity: true
        retentionPeriod: 10d
        resources:
          requests:
            cpu: 250m
            memory: 2Gi
          limits:
            memory: 2Gi
        storage:
          storageClassName: rook-ceph-block
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi

    vmagent:
      enabled: true
      spec:
        useStrictSecurity: true
        scrapeInterval: 30s
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            memory: 512Mi

    vmalert:
      enabled: true
      spec:
        useStrictSecurity: true
        evaluationInterval: 30s
        extraArgs:
          http.pathPrefix: /
          # TODO: remove when kube-prometheus-stack not managing alerts
          notifier.blackhole: "true"
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 256Mi

    alertmanager:
      enabled: false
