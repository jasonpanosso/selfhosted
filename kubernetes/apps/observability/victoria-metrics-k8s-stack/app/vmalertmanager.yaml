---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/operator.victoriametrics.com/vmalertmanager_v1beta1.json
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAlertmanager
metadata:
  name: alertmanager
spec:
  image:
    repository: prom/alertmanager
    # renovate: datasource=docker depName=prom/alertmanager
    tag: v0.34.2
  replicaCount: 1
  # operator handles mounting
  disableAutomountServiceAccountToken: true
  useStrictSecurity: true
  externalURL: https://alerts.${domain}.${tld}
  # routes come from vmalertmanagerconfig.yaml, which routes alerts from every namespace
  selectAllByDefault: true
  disableNamespaceMatcher: true
  configRawYaml: |
    route:
      receiver: blackhole
    receivers:
      - name: blackhole
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      memory: 128Mi
  storage:
    volumeClaimTemplate:
      spec:
        storageClassName: rook-ceph-block
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
---
# The operator's own Service is headless, so clients would connect to pod IPs and keep
# using a replaced pod's IP. This ClusterIP Service always points at the live pod.
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vmalertmanager
    app.kubernetes.io/instance: alertmanager
  ports:
    - name: http
      port: 9093
      targetPort: 9093
      protocol: TCP
