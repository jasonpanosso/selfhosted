---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/operator.victoriametrics.com/vmalertmanagerconfig_v1beta1.json
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAlertmanagerConfig
metadata:
  # not "alertmanager": the converter's copy of the old AlertmanagerConfig has that name and is deleted with it
  name: notifications
spec:
  route:
    group_by: ["alertname", "job"]
    group_interval: 10m
    group_wait: 1m
    # warning/info: quiet notification; critical pages via the route below
    receiver: pushover-quiet
    repeat_interval: 12h
    routes:
      - receiver: "null"
        matchers:
          - alertname="InfoInhibitor"
      - receiver: heartbeat
        group_interval: 5m
        group_wait: 0s
        repeat_interval: 5m
        matchers:
          - alertname="Watchdog"
      - receiver: pushover
        matchers:
          - severity="critical"
  inhibit_rules:
    - equal: ["alertname", "namespace"]
      source_matchers:
        - severity="critical"
      target_matchers:
        - severity="warning"
  receivers:
    - name: "null"
    - name: heartbeat
      webhook_configs:
        - url_secret:
            name: alertmanager
            key: ALERTMANAGER_HEARTBEAT_URL
    - name: pushover
      pushover_configs:
        - html: true
          message: &message |-
            {{- range .Alerts }}
              {{- if ne .Annotations.description "" }}
                {{ .Annotations.description }}
              {{- else if ne .Annotations.summary "" }}
                {{ .Annotations.summary }}
              {{- else if ne .Annotations.message "" }}
                {{ .Annotations.message }}
              {{- else }}
                Alert description not available
              {{- end }}
              {{- if gt (len .Labels.SortedPairs) 0 }}
                <small>
                  {{- range .Labels.SortedPairs }}
                    <b>{{ .Name }}:</b> {{ .Value }}
                  {{- end }}
                </small>
              {{- end }}
            {{- end }}
          priority: |-
            {{ if eq .Status "firing" }}1{{ else }}0{{ end }}
          send_resolved: true
          sound: bugle
          title: &title >-
            [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}]
            {{ .CommonLabels.alertname }}
          token: &token
            name: alertmanager
            key: PUSHOVER_API_TOKEN
          user_key: &userKey
            name: alertmanager
            key: PUSHOVER_USER_KEY
          url_title: View in Alertmanager
    - name: pushover-quiet
      pushover_configs:
        - html: true
          message: *message
          # -1: delivered without sound or vibration
          priority: "-1"
          send_resolved: true
          title: *title
          token: *token
          user_key: *userKey
          url_title: View in Alertmanager
