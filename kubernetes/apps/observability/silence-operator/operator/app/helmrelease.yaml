---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app silence-operator
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  upgrade:
    strategy:
      name: RemediateOnFailure
    remediation:
      remediateLastFailure: true
      retries: 2
  values:
    alertmanagerAddress: http://alertmanager.observability.svc.cluster.local:9093
    resources:
      requests:
        cpu: 10m
        memory: 96Mi
      limits:
        # chart default limits cpu to 50m, which throttled it
        cpu: null
        memory: 96Mi
    crds:
      install: true
    networkPolicy:
      enabled: false
