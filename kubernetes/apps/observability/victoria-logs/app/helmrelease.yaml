---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app victoria-logs
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  upgrade:
    strategy:
      name: RemediateOnFailure
    remediation:
      remediateLastFailure: true
      retries: 2
  values:
    dashboards:
      enabled: true
    # the chart only sets automountServiceAccountToken on the pod when it has its own ServiceAccount
    serviceAccount:
      create: true
      automountToken: false
    server:
      fullnameOverride: victoria-logs
      podSecurityContext:
        enabled: true
        fsGroup: 2000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      persistentVolume:
        enabled: true
        storageClassName: rook-ceph-block
        size: 50Gi
      retentionPeriod: 30d
      # caches size to memory.allowedPercent (60%) of the limit; with no limit they sized to the node
      resources:
        requests:
          cpu: 50m
          memory: 1Gi
        limits:
          memory: 1Gi
      serviceMonitor:
        enabled: true
