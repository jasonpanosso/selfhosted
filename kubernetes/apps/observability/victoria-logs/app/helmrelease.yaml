---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app victoria-logs
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
  rollback:
    cleanupOnFail: true
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    strategy:
      name: RemediateOnFailure
    remediation:
      remediateLastFailure: true
      retries: 2
  values:
    dashboards:
      enabled: true
    # the chart only sets automountServiceAccountToken on the pod when it has its own ServiceAccount
    serviceAccount:
      create: true
      automountToken: false
    server:
      fullnameOverride: victoria-logs
      podSecurityContext:
        enabled: true
        fsGroup: 2000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      persistentVolume:
        enabled: true
        storageClassName: rook-ceph-block
        size: 50Gi
      retentionPeriod: 30d
      extraArgs:
        deleteAuthKey: &authKey file:///etc/vm/secrets/victoria-logs/VICTORIA_LOGS_AUTH_KEY
        forceMergeAuthKey: *authKey
        forceFlushAuthKey: *authKey
        logNewStreamsAuthKey: *authKey
        partitionManageAuthKey: *authKey
        flagsAuthKey: *authKey
        pprofAuthKey: *authKey
      extraVolumes:
        - name: auth-key
          secret:
            secretName: victoria-logs
      extraVolumeMounts:
        - name: auth-key
          mountPath: /etc/vm/secrets/victoria-logs
          readOnly: true
      # caches size to memory.allowedPercent (60%) of the limit; with no limit they sized to the node
      resources:
        requests:
          cpu: 50m
          memory: 1Gi
        limits:
          memory: 1Gi
      serviceMonitor:
        enabled: true
