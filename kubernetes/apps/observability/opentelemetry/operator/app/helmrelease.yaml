---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app opentelemetry-operator
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
  rollback:
    cleanupOnFail: true
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    # never roll back: a rollback re-applies this chart's older (templated) CRDs
    strategy:
      name: RetryOnFailure
  values:
    replicaCount: 1
    crds:
      create: true
    manager:
      # need contrib for tcp_log
      collectorImage:
        repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib
      resources:
        limits:
          memory: 160Mi
          ephemeral-storage: 50Mi
        requests:
          cpu: 10m
          memory: 160Mi
          ephemeral-storage: 50Mi
      serviceMonitor:
        enabled: true
      createRbacPermissions: false

      leaderElection:
        enabled: true
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
        seccompProfile:
          type: RuntimeDefault

      featureGatesMap:
        # replaced by ciliumnetworkpolicy.yaml; the operator pinned its policy to a single apiserver IP
        operator.networkpolicy: false
        operand.networkpolicy: true
