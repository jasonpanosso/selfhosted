---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/opentelemetry.io/opentelemetrycollector_v1beta1.json
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: cluster
spec:
  mode: deployment
  priorityClassName: system-cluster-critical
  # single replica: k8s_objects resumes from its persisted resourceVersion instead of leader election
  replicas: 1
  # the RWO volume can't be attached to two pods across nodes, and two pods would duplicate the watch
  deploymentUpdateStrategy:
    type: Recreate
  serviceAccount: otel-cluster-collector
  podSecurityContext:
    runAsNonRoot: true
    fsGroup: 10001
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 256Mi
  env:
    - name: GOMEMLIMIT
      value: 200MiB
    - name: OTEL_RESOURCE_ATTRIBUTES
      value: "k8s.cluster.name=prod"
  config:
    extensions:
      # persists the k8s_objects resourceVersion and the exporter queue across restarts
      file_storage:
        directory: /var/lib/otelcol
        compaction:
          directory: /var/lib/otelcol
          on_start: true
          on_rebound: true

    exporters:
      debug: {}
      otlp_http/victoria-logs:
        logs_endpoint: http://victoria-logs.observability.svc.cluster.local:9428/insert/opentelemetry/v1/logs
        tls:
          insecure: true
        # retry until victoria-logs is back
        retry_on_failure:
          enabled: true
          max_elapsed_time: 0
        sending_queue:
          enabled: true
          storage: file_storage
          sizer: bytes
          queue_size: 268435456 # 256MiB, leaves room on the 1Gi volume for compaction's copy
          batch:
            sizer: items
            min_size: 1000
            max_size: 1500
            flush_timeout: 1s

    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 15
      resource_detection/env:
        detectors: [env]
        timeout: 2s
        override: false
      # the body is the watch event ({type, object}); victoria-logs takes _msg from the body,
      # so move the event into attributes under the same names and use its note as the message
      transform/events:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              - delete_key(log.body["object"]["metadata"], "managedFields")
              - set(log.attributes["type"], log.body["type"])
              - set(log.attributes["object"], log.body["object"])
              - set(log.body, log.attributes["object"]["note"])

    receivers:
      k8s_objects:
        auth_type: serviceAccount
        storage: file_storage
        objects:
          - name: events
            group: events.k8s.io
            mode: watch
            exclude_watch_type:
              - DELETED

    service:
      extensions:
        - file_storage
      pipelines:
        logs:
          receivers:
            - k8s_objects
          processors:
            - memory_limiter
            - transform/events
            - resource_detection/env
          exporters:
            # - debug
            - otlp_http/victoria-logs
  volumeMounts:
    - mountPath: /var/lib/otelcol
      name: state
  volumes:
    - name: state
      persistentVolumeClaim:
        claimName: otel-cluster-collector
