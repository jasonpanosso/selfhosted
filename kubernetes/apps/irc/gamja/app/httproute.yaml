---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: &app gamja
  labels:
    app.kubernetes.io/name: *app
spec:
  parentRefs:
    - name: cilium-internal
      namespace: kube-system
      sectionName: https
  hostnames:
    # trial host while thelounge keeps irc.
    - soju.${domain}.${tld}
  rules:
    # gamja's default WebSocket URL, served by soju
    - matches:
        - path:
            type: PathPrefix
            value: /socket
      filters: &filters
        - type: ExternalAuth
          externalAuth:
            protocol: HTTP
            backendRef:
              name: authelia
              namespace: auth
              port: 80
            http:
              path: /api/authz/ext-authz/
              allowedHeaders:
                - accept
                - cookie
                - x-forwarded-proto
                - x-requested-with
              allowedResponseHeaders:
                - Remote-User
                - Remote-Name
                - Remote-Groups
                - Remote-Email
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-For
                value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000
      backendRefs:
        - name: soju
          port: 80
      timeouts:
        request: 0s
    - filters: *filters
      backendRefs:
        - name: *app
          port: 80
