---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  annotations:
    # Moving to FluxInstance.spec.sync: keep this object when it leaves the inventory
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  path: ./kubernetes/clusters/prod
  interval: 1h
  retryInterval: 2m
  timeout: 20m
  prune: true
  wait: false
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  sourceRef:
    kind: GitRepository
    name: flux-system
