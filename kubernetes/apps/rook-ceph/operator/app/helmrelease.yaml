---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app rook-ceph
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  upgrade:
    strategy:
      name: RetryOnFailure
  values:
    crds:
      enabled: true # DO NOT CHANGE - WILL RESULT IN DATA LOSS
    csi:
      # cephcsi v3.18+ is built on Rocky Linux 10, which needs x86-64-v3.
      # worker-3/4 are x86-64-v2 only.
      # https://github.com/rook/rook/issues/18607
      cephcsi:
        repository: quay.io/cephcsi/cephcsi
        # renovate: datasource=docker depName=quay.io/cephcsi/cephcsi
        tag: v3.18.2-rocky9
      # chart renders this empty; false makes rook delete the CephConnection and ClientProfile
      createCsiOperatorResources: true
    enableDiscoveryDaemon: true
    monitoring:
      enabled: true
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 512Mi
    discover:
      # rook parses this string, wrapped in a resources key
      resources: |
        resources:
          requests:
            cpu: 10m
            memory: 160Mi
          limits:
            memory: 160Mi
    ceph-csi-operator:
      controllerManager:
        manager:
          resources:
            requests:
              cpu: 10m
              memory: 96Mi
            limits:
              # chart default limits cpu to 500m
              cpu: null
              memory: 96Mi
