---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app rook-ceph
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
  rollback:
    cleanupOnFail: true
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    # never roll back: a rollback can downgrade Ceph or the operator mid-upgrade
    strategy:
      name: RetryOnFailure
  values:
    crds:
      enabled: true # DO NOT CHANGE - WILL RESULT IN DATA LOSS
    csi:
      # cephcsi v3.18+ is built on Rocky Linux 10, which needs x86-64-v3.
      # worker-3/4 are x86-64-v2 only.
      # https://github.com/rook/rook/issues/18607
      cephcsi:
        repository: quay.io/cephcsi/cephcsi
        # renovate: datasource=docker depName=quay.io/cephcsi/cephcsi
        tag: v3.18.2-rocky9@sha256:c5081aaac2cc50043b9e45f126aa310e41402aee0284d588234df2074c6b25b0
      # chart renders this empty; false makes rook delete the CephConnection and ClientProfile
      createCsiOperatorResources: true
    # 1.21 (rook d18ff0da) treats an empty partition sharing a serial with a used one as a
    # device change, so every hourly probe triggers a full CephCluster reconcile
    enableDiscoveryDaemon: false
    monitoring:
      enabled: true
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 512Mi
    ceph-csi-operator:
      controllerManager:
        manager:
          resources:
            requests:
              cpu: 10m
              memory: 96Mi
            limits:
              # chart default limits cpu to 500m
              cpu: null
              memory: 96Mi
