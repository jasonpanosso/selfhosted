---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app rook-ceph
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  upgrade:
    strategy:
      name: RetryOnFailure
  values:
    crds:
      enabled: true # DO NOT CHANGE - WILL RESULT IN DATA LOSS
    enableDiscoveryDaemon: true
    monitoring:
      enabled: true
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 512Mi
    discover:
      # rook parses this string, wrapped in a resources key
      resources: |
        resources:
          requests:
            cpu: 10m
            memory: 160Mi
          limits:
            memory: 160Mi
    ceph-csi-operator:
      controllerManager:
        manager:
          resources:
            requests:
              cpu: 10m
              memory: 96Mi
            limits:
              # chart default limits cpu to 500m
              cpu: null
              memory: 96Mi
