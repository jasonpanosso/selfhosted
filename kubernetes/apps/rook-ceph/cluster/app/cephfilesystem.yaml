---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/ceph.rook.io/cephfilesystem_v1.json
apiVersion: ceph.rook.io/v1
kind: CephFilesystem
metadata:
  name: mediafs
spec:
  # Mounted at its root by static PVs, so it lives outside the rook-ceph-cluster
  # chart, which would add a csi subvolume group to the root.
  metadataPool:
    failureDomain: host
    enableCrushUpdates: true
    deviceClass: nvme
    replicated:
      size: 3
      requireSafeReplicaSize: true
  dataPools:
    - name: replicated
      failureDomain: osd
      enableCrushUpdates: true
      deviceClass: hdd
      replicated:
        size: 3
        requireSafeReplicaSize: true
  preserveFilesystemOnDelete: true
  metadataServer:
    activeCount: 1
    activeStandby: true
    priorityClassName: system-cluster-critical
    resources:
      requests:
        cpu: 250m
        memory: 1024Mi
      limits:
        memory: 1024Mi
