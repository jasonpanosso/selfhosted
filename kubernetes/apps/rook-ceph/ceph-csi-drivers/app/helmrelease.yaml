---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app ceph-csi-drivers
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  upgrade:
    strategy:
      name: RemediateOnFailure
    remediation:
      remediateLastFailure: true
      retries: 2
  values:
    drivers:
      cephfs:
        enabled: true
        name: rook-ceph.cephfs.csi.ceph.com
        nodePlugin:
          resources:
            plugin:
              requests:
                cpu: 25m
                memory: 192Mi
              limits:
                memory: 192Mi
            registrar:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 32Mi
            logRotator:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 32Mi
        controllerPlugin:
          resources:
            plugin:
              requests:
                cpu: 25m
                memory: 192Mi
              limits:
                memory: 192Mi
            provisioner:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 128Mi
            attacher:
              requests:
                cpu: 10m
                memory: 96Mi
              limits:
                memory: 96Mi
            resizer:
              requests:
                cpu: 10m
                memory: 96Mi
              limits:
                memory: 96Mi
            snapshotter:
              requests:
                cpu: 10m
                memory: 96Mi
              limits:
                memory: 96Mi
            logRotator:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 32Mi
      nfs:
        enabled: false
      nvmeof:
        enabled: false
      rbd:
        enabled: true
        name: rook-ceph.rbd.csi.ceph.com
        snapshotPolicy: volumeSnapshot
        nodePlugin:
          resources:
            plugin:
              requests:
                cpu: 25m
                memory: 192Mi
              limits:
                memory: 192Mi
            registrar:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 32Mi
            logRotator:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 32Mi
        controllerPlugin:
          resources:
            plugin:
              requests:
                cpu: 25m
                memory: 192Mi
              limits:
                memory: 192Mi
            provisioner:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 128Mi
            attacher:
              requests:
                cpu: 10m
                memory: 96Mi
              limits:
                memory: 96Mi
            resizer:
              requests:
                cpu: 10m
                memory: 96Mi
              limits:
                memory: 96Mi
            snapshotter:
              requests:
                cpu: 10m
                memory: 96Mi
              limits:
                memory: 96Mi
            logRotator:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 32Mi
