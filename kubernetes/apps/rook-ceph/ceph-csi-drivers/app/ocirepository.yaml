---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: ceph-csi-drivers
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    # must equal the ceph-csi-operator version bundled with rook-ceph (rook-ceph-csi CI check)
    tag: 1.1.0
    digest: sha256:8c9ddb89e991889a41876b4eac85908a04dbe007b3766843bdac5db59ccab2a2
  url: oci://ghcr.io/home-operations/charts-mirror/ceph-csi-drivers
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: ^https://token\.actions\.githubusercontent\.com$
        subject: ^https://github\.com/home-operations/charts-mirror/\.github/workflows/app-builder\.yaml@refs/heads/main$
