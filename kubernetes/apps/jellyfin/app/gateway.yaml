---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/gateway_v1.json
# is exposed to VLAN 50, needs to be separate
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: jellyfin
spec:
  gatewayClassName: cilium-lb
  addresses:
    - type: IPAddress
      value: 192.168.21.13
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: watch.home.${domain}.${tld}
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: watch.home.${domain}.${tld}
      allowedRoutes:
        namespaces:
          from: Same
      tls:
        certificateRefs:
          - kind: Secret
            name: jellyfin-tls
