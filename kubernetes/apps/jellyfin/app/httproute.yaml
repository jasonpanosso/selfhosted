---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: &app jellyfin
  labels:
    app.kubernetes.io/name: *app
spec:
  parentRefs:
    - name: cilium-home
      namespace: kube-system
      sectionName: jellyfin-https
  hostnames:
    - watch.home.${domain}.${tld}
  rules:
    # no ExternalAuth, strip identity headers so they can't be spoofed
    - filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-For
                value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
            remove:
              - Remote-User
              - Remote-Name
              - Remote-Groups
              - Remote-Email
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000
      backendRefs:
        - name: *app
          port: 80
      timeouts:
        request: 0s
