---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app topolvm
spec:
  chart:
    spec:
      chart: topolvm
      version: 17.3.1
      sourceRef:
        kind: HelmRepository
        name: *app
  interval: 1h
  upgrade:
    strategy:
      name: RemediateOnFailure
    remediation:
      remediateLastFailure: true
      retries: 2
  # the chart has no additive volumeMounts for topolvm-node, append here instead
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: DaemonSet
              name: topolvm-node
            patch: |-
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: topolvm-node
              spec:
                template:
                  spec:
                    containers:
                      - name: topolvm-node
                        volumeMounts:
                          - name: selinuxfs
                            mountPath: /sys/fs/selinux
                          - name: selinux-config
                            mountPath: /etc/selinux/config
                            subPath: config
                            readOnly: true
  values:
    lvmd:
      # lvmd runs embedded in the node plugin (node.lvmdEmbedded), no separate DaemonSet
      managed: false
      deviceClasses:
        - name: thick
          # LVMVolumeGroupConfig in talos/worker.yaml
          volume-group: topolvm
          default: true
          # the volume group belongs to TopoLVM alone
          spare-gb: 0
    node:
      lvmdEmbedded: true
      priorityClassName: system-node-critical
      nodeSelector:
        storage.home.internal/topolvm: "true"
      # mount(8) only keeps the context= option when libselinux sees SELinux enabled:
      # selinuxfs mounted read-write (a read-only one counts as disabled) and /etc/selinux/config present.
      # mounted into topolvm-node by the postRenderers patch below
      additionalVolumes:
        - name: selinuxfs
          hostPath:
            path: /sys/fs/selinux
            type: Directory
        - name: selinux-config
          configMap:
            name: topolvm-selinux-config
      prometheus:
        podMonitor:
          enabled: true
    controller:
      priorityClassName: system-cluster-critical
      prometheus:
        podMonitor:
          enabled: true
    # chart hardcodes the container securityContexts, can't set readOnlyRootFilesystem
    securityContext:
      runAsNonRoot: true
      runAsUser: 10000
      runAsGroup: 10000
      seccompProfile:
        type: RuntimeDefault
    priorityClass:
      enabled: false
    resources:
      topolvm_node:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          memory: 128Mi
      csi_registrar:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 64Mi
      liveness_probe:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 64Mi
      topolvm_controller:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 64Mi
      csi_provisioner:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 64Mi
      csi_resizer:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 64Mi
    # thick volumes can't be restored from snapshots; revisit once Talos can declare thin pools
    snapshot:
      enabled: false
    storageClasses:
      - name: topolvm
        storageClass:
          fsType: xfs
          reclaimPolicy: Delete
          isDefaultClass: false
          volumeBindingMode: WaitForFirstConsumer
          allowVolumeExpansion: true
          additionalParameters:
            topolvm.io/device-class: thick
          # Talos SELinux label for user volumes (talos.dev SELinux "CSI volumes")
          mountOptions: ["discard", "context=system_u:object_r:ephemeral_t:s0"]
