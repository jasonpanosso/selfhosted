---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cloudnative-pg
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: cloudnative-pg
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    # admission webhooks, failurePolicy: Fail
    - fromEntities:
        - kube-apiserver
      toPorts: &webhook
        - ports:
            - port: "9443"
              protocol: TCP
    - fromNodes:
        - matchLabels:
            node-role.kubernetes.io/control-plane: ""
      toPorts: *webhook
  egress:
    # instance manager status
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: db
            cnpg.io/cluster: pgcluster
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: plugin-barman-cloud
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
