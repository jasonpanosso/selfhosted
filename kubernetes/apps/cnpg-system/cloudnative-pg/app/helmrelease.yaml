---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app cloudnative-pg
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
  rollback:
    cleanupOnFail: true
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    # never roll back: a rollback re-applies this chart's older (templated) CRDs
    strategy:
      name: RetryOnFailure
  values:
    # standby operator (--leader-elect): primary failover needs a running operator
    replicaCount: 2
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: cloudnative-pg
                app.kubernetes.io/instance: cloudnative-pg
            topologyKey: kubernetes.io/hostname
    resources:
      requests:
        cpu: 15m
        memory: 192Mi
      limits:
        memory: 192Mi
    monitoring:
      podMonitorEnabled: true
