---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ./deployment.yaml
  - ./service.yaml
  - ./ingressroute.yaml

# Opt the Volsync component's PVC into Kopiur backups during the dual-run.
# Targets by kind because the PVC is still named "${APP}" at build time.
patches:
  - target:
      kind: PersistentVolumeClaim
    patch: |-
      - op: add
        path: /metadata/labels
        value:
          kopiur/policy: hourly

configMapGenerator:
  - name: thelounge
    files:
      - config.js=./resources/config.js
    options:
      disableNameSuffixHash: true
