---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ./ciliumnetworkpolicy.yaml
  - ./deployment.yaml
  - ./service.yaml
  - ./httproute.yaml
  - ./pvc.yaml

configMapGenerator:
  - name: thelounge
    files:
      - config.js=./resources/config.js
    options:
      disableNameSuffixHash: true
