---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone/deployment-apps-v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: &app thelounge
  labels:
    app.kubernetes.io/name: *app
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: *app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: *app
    spec:
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - image: ghcr.io/home-operations/thelounge:4.5.2@sha256:b1603864b3eae673f780aa56e966d9b488986ed71d2260b408ebc9a6d5cdd0df
          name: *app
          ports:
            - containerPort: 9000
              name: http
          env:
            - name: TZ
              value: Etc/UTC
            - name: THELOUNGE_HOME
              value: /config
            - name: THELOUNGE_PORT
              value: "9000"
            - name: THELOUNGE_MESSAGE_STORAGE
              value: "[sqlite]"
            - name: THELOUNGE_STORAGE_POLICY_ENABLED
              value: "true"
            - name: THELOUNGE_STORAGE_POLICY_MAX_AGE_DAYS
              value: "7"
            - name: THELOUNGE_STORAGE_POLICY_DELETION_POLICY
              value: everything
          livenessProbe: &probes
            httpGet:
              path: /
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe: *probes
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: config
              mountPath: /config
            - name: configjs
              mountPath: /config/config.js
              subPath: config.js
              readOnly: true
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: *app
        - name: configjs
          configMap:
            name: *app
