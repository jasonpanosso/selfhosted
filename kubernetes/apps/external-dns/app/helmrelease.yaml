---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app external-dns
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  upgrade:
    strategy:
      name: RemediateOnFailure
    remediation:
      remediateLastFailure: true
      retries: 2
  values:
    fullnameOverride: external-dns
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"

    provider:
      name: cloudflare
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: external-dns
            key: CF_API_TOKEN

    sources:
      # public HTTPRoutes
      - gateway-httproute
      # LoadBalancer Services with an external-dns.kubernetes.io/hostname annotation
      - service
    # cilium-internal routes (*.home) are served on the LAN by k8s-gateway, never published
    gatewayNamespace: kube-system
    extraArgs:
      gateway-name: cilium

    domainFilters:
      - ${domain}.${tld}
    # only records with this owner's TXT entry are ever changed or deleted
    policy: sync
    registry: txt
    txtOwnerId: selfhosted
    triggerLoopOnEvent: true

    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 64Mi
