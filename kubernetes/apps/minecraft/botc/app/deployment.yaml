---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone/deployment-apps-v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: &app botc
  labels:
    app.kubernetes.io/name: *app
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: *app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: *app
    spec:
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: *app
          image: ghcr.io/itzg/minecraft-server:2026.10.1-java25@sha256:d12aed7e35981dfe259b60fbfee77d23a19b5898a7a31dca298d18b47b7b5776
          env:
            - name: EULA
              value: "true"
            - name: TZ
              value: America/Detroit
            - name: TYPE
              value: MODRINTH
            - name: VERSION
              value: "1.21.11"
            - name: MODRINTH_MODPACK
              value: https://modrinth.com/modpack/blood-on-the-clocktower/version/1.6.0
            - name: PLUGINS
              value: |
                https://cdn.modrinth.com/data/P7dR8mSH/versions/6qAuTtLR/fabric-api-0.141.6%2B1.21.11.jar
                https://cdn.modrinth.com/data/8dI2tmqs/versions/nR8AIdvx/FabricProxy-Lite-2.11.0.jar
                https://cdn.modrinth.com/data/Wq5SjeWM/versions/3g5Zg7dL/fancymenu_fabric_3.9.12_MC_1.21.11.jar
            - name: FABRIC_PROXY_SECRET_FILE
              value: /secrets/MINECRAFT_PROXY_SECRET
            - name: MEMORY
              value: "75%"
            # https://exa.y2k.diy/garden/jvm-args/
            - name: JVM_XX_OPTS
              value: -XX:+UseShenandoahGC -XX:+UseCompactObjectHeaders
            - name: STOP_DURATION
              value: "60"
            - name: ENABLE_RCON
              value: "true"
            - name: RCON_PASSWORD_FILE
              value: /secrets/MINECRAFT_COBBLEMON_RCON_PASSWORD
            - name: MOTD
              value: mingee is lying
            - name: ICON
              value: https://cdn.modrinth.com/data/nihni4Eg/feaeb4d5f738be51be30085b610884639af99b8a.png
            - name: DIFFICULTY
              value: normal
            - name: MODE
              value: survival
            - name: SPAWN_PROTECTION
              value: "1"
            # handled by velocity
            - name: ONLINE_MODE
              value: "false"
            - name: WHITELIST
              value: Jayce
            - name: OPS
              value: Jayce
          ports:
            - name: minecraft
              containerPort: 25565
              protocol: TCP
            - name: rcon
              containerPort: 25575
              protocol: TCP
            - name: voicechat
              containerPort: 27722
              protocol: UDP
          startupProbe:
            exec:
              command: [mc-health]
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe: &probes
            exec:
              command: [mc-health]
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 8
          readinessProbe: *probes
          resources:
            requests:
              cpu: 1000m
              memory: 2Gi
            limits:
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: secrets
              mountPath: /secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: *app
        - name: secrets
          secret:
            secretName: *app
        - name: tmp
          emptyDir: {}
