---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app botc
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  timeout: 10m0s
  upgrade:
    strategy:
      name: RemediateOnFailure
    remediation:
      remediateLastFailure: true
      retries: 2
  values:
    fullnameOverride: *app
    replicaCount: 1
    image:
      repository: ghcr.io/itzg/minecraft-server
      tag: 2026.9.0-java21@sha256:d92e778d5964439c29325963a88189a25be3a03b724676ff638b356f19d317f2
    resources:
      requests:
        cpu: 1000m
        memory: 2Gi
    podSecurityContext:
      runAsUser: 65534
      runAsGroup: 65534
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
    startupProbe:
      enabled: true
    extraEnv:
      TZ: America/Detroit
      USE_MEOWICE_FLAGS: "true"
      FABRIC_PROXY_SECRET_FILE: /secrets/MINECRAFT_PROXY_SECRET
      MODRINTH_MODPACK: https://modrinth.com/modpack/blood-on-the-clocktower/version/1.6.0
    extraVolumes:
      - volumeMounts:
          - name: forwarding-secret
            mountPath: /secrets
            readOnly: true
        volumes:
          - name: forwarding-secret
            secret:
              secretName: *app
    persistence:
      dataDir:
        enabled: true
        existingClaim: *app
    minecraftServer:
      eula: true
      version: 1.21.11
      type: MODRINTH
      pluginUrls:
        - https://cdn.modrinth.com/data/P7dR8mSH/versions/6qAuTtLR/fabric-api-0.141.6%2B1.21.11.jar?mr_download_reason=standalone&mr_game_version=1.21.11&mr_loader=fabric
        - https://cdn.modrinth.com/data/8dI2tmqs/versions/nR8AIdvx/FabricProxy-Lite-2.11.0.jar?mr_download_reason=standalone&mr_game_version=1.21.11&mr_loader=fabric
        - https://cdn.modrinth.com/data/Wq5SjeWM/versions/3g5Zg7dL/fancymenu_fabric_3.9.12_MC_1.21.11.jar?mr_download_reason=standalone&mr_game_version=1.21.11&mr_loader=fabric
      icon: https://cdn.modrinth.com/data/nihni4Eg/feaeb4d5f738be51be30085b610884639af99b8a.png
      memory: 2G
      extraPorts:
        - name: voicechat
          protocol: UDP
          containerPort: 27722
          service:
            enabled: true
            embedded: true
            type: ClusterIP
            port: 27722
          ingress:
            enabled: false
      serviceType: ClusterIP
      clusterIP: 10.96.0.41
      difficulty: normal
      levelType: normal
      spawnProtection: 1
      gameMode: survival
      pvp: default
      onlineMode: false
      whitelist: "Jayce"
      ops: "Jayce"
      motd: "mingee is lying"
      viewDistance: default
      rcon:
        enabled: true
        existingSecret: *app
        secretKey: MINECRAFT_COBBLEMON_RCON_PASSWORD

    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
