---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: botc
spec:
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  refreshPolicy: Periodic
  refreshInterval: 1h
  data:
    - secretKey: MINECRAFT_COBBLEMON_RCON_PASSWORD
      remoteRef:
        key: MINECRAFT_COBBLEMON_RCON_PASSWORD
    - secretKey: MINECRAFT_PROXY_SECRET
      remoteRef:
        key: MINECRAFT_PROXY_SECRET
  target:
    name: botc
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        MINECRAFT_COBBLEMON_RCON_PASSWORD: "{{ .MINECRAFT_COBBLEMON_RCON_PASSWORD }}"
        # mounted into /config; itzg copies it to /data/config on start
        FabricProxy-Lite.toml: |
          hackOnlineMode = true
          hackEarlySend = false
          hackMessageChain = false
          disconnectMessage = "This server requires you to connect with Velocity."
          secret = {{ .MINECRAFT_PROXY_SECRET | toJson }}
