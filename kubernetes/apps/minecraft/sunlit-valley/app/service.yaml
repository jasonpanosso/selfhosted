---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone/service-v1.json
apiVersion: v1
kind: Service
metadata:
  name: &app sunlit-valley
  labels:
    app.kubernetes.io/name: *app
spec:
  # minecraft-proxy's velocity.toml points at this address
  clusterIP: 10.96.0.42
  selector:
    app.kubernetes.io/name: *app
  ports:
    - name: minecraft
      port: 25565
      targetPort: minecraft
      protocol: TCP
    - name: voicechat
      port: 24454
      targetPort: voicechat
      protocol: UDP
    - name: rcon
      port: 25575
      targetPort: rcon
      protocol: TCP
