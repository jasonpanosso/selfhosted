---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./ocirepository.yaml
  - ./pvc.yaml

configMapGenerator:
  - name: sunlit-valley-patches
    files:
      - proxy-compatible-forge.json=./resources/proxy-compatible-forge.json
    options:
      disableNameSuffixHash: true
      # keep ${CFG_PROXY_SECRET} for the image; Flux postBuild would substitute it
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
