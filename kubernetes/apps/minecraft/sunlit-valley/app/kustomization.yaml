---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ./ciliumnetworkpolicy.yaml
  - ./deployment.yaml
  - ./externalsecret.yaml
  - ./httproute.yaml
  - ./listenerset.yaml
  - ./pvc.yaml
  - ./service.yaml

configMapGenerator:
  - name: sunlit-valley-patches
    files:
      - forge-server.json=./resources/forge-server.json
    options:
      disableNameSuffixHash: true
