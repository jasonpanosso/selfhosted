---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/listenerset_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: sunlit-valley-rcon
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  parentRef:
    name: cilium
    namespace: kube-system
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: rcon.sunlit-valley.${domain}.${tld}
      tls:
        certificateRefs:
          - name: sunlit-valley-rcon-tls
