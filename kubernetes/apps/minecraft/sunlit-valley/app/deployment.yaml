---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone/deployment-apps-v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: &app sunlit-valley
  labels:
    app.kubernetes.io/name: *app
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: *app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: *app
    spec:
      # longer than STOP_DURATION, so the world save on stop isn't killed
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values:
                      - amd64
      containers:
        - name: *app
          image: ghcr.io/itzg/minecraft-server:2026.10.1-java21@sha256:07ab333a8542208c4c863a78fd3cf3fd1138d5a2e118306e1a316d202f69ab74
          env:
            - name: EULA
              value: "true"
            - name: TZ
              value: America/Detroit
            - name: TYPE
              value: AUTO_CURSEFORGE
            - name: VERSION
              value: "1.20.1"
            - name: CF_SLUG
              value: society-sunlit-valley
            - name: CF_FILENAME_MATCHER
              value: "3.4.3"
            - name: CF_EXCLUDE_MODS
              # does not work on 1.20.1 with velocity
              value: better-compatibility-checker
            - name: CF_API_KEY_FILE
              value: /secrets/CURSEFORGE_API_KEY
            - name: PLUGINS
              value: |
                https://cdn.modrinth.com/data/vDyrHl8l/versions/uRu4jaFs/proxy-compatible-forge-1.3.0.jar
                https://cdn.modrinth.com/data/9eGKb6K1/versions/nHtyikTv/voicechat-forge-1.20.1-2.4.32.jar
            - name: PATCH_DEFINITIONS
              value: /patches
            - name: CFG_PROXY_SECRET_FILE
              value: /secrets/MINECRAFT_PROXY_SECRET
            # Xms and Xmx both 75% of the memory limit
            - name: MEMORY
              value: "75%"
            - name: JVM_XX_OPTS
              value: -XX:+UseShenandoahGC
            - name: STOP_DURATION
              value: "60"
            - name: ENABLE_RCON
              value: "true"
            - name: RCON_PASSWORD_FILE
              value: /secrets/MINECRAFT_COBBLEMON_RCON_PASSWORD
            - name: MOTD
              value: pour one out for cobblemon academy
            - name: ICON
              value: https://i.imgur.com/xCwev3X.png
            - name: DIFFICULTY
              value: normal
            - name: MODE
              value: survival
            - name: SPAWN_PROTECTION
              value: "0"
            # handled by velocity
            - name: ONLINE_MODE
              value: "false"
            - name: WHITELIST
              value: Jayce
            - name: OPS
              value: Jayce
          ports:
            - name: minecraft
              containerPort: 25565
              protocol: TCP
            - name: rcon
              containerPort: 25575
              protocol: TCP
            - name: voicechat
              containerPort: 24454
              protocol: UDP
          startupProbe:
            exec:
              command: [mc-health]
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe: &probes
            exec:
              command: [mc-health]
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 8
          readinessProbe: *probes
          resources:
            requests:
              cpu: 500m
              memory: 4Gi
            limits:
              memory: 6Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: logs
              mountPath: /data/logs
            - name: crash-reports
              mountPath: /data/crash-reports
            - name: secrets
              mountPath: /secrets
              readOnly: true
            - name: patches
              mountPath: /patches
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: *app
        - name: logs
          emptyDir: {}
        - name: crash-reports
          emptyDir: {}
        - name: secrets
          secret:
            secretName: *app
        - name: patches
          configMap:
            name: sunlit-valley-patches
        - name: tmp
          emptyDir: {}
