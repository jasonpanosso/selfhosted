---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sunlit-valley
spec:
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  refreshPolicy: Periodic
  refreshInterval: 1h
  data:
    - secretKey: MINECRAFT_SUNLIT_VALLEY_RCON_PASSWORD
      remoteRef:
        key: MINECRAFT_SUNLIT_VALLEY_RCON_PASSWORD
    - secretKey: CURSEFORGE_API_KEY
      remoteRef:
        key: CURSEFORGE_API_KEY
    - secretKey: MINECRAFT_PROXY_SECRET
      remoteRef:
        key: MINECRAFT_PROXY_SECRET
  target:
    name: sunlit-valley
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        MINECRAFT_SUNLIT_VALLEY_RCON_PASSWORD: "{{ .MINECRAFT_SUNLIT_VALLEY_RCON_PASSWORD }}"
        CURSEFORGE_API_KEY: "{{ .CURSEFORGE_API_KEY }}"
        # mounted into /config; itzg copies it to /data/config on start
        proxy-compatible-forge.toml: |
          version = 2.0

          [forwarding]
          enabled = true
          mode = "MODERN"
          secret = {{ .MINECRAFT_PROXY_SECRET | toJson }}
          approvedProxyHosts = []

          [crossStitch]
          enabled = true
          # VanillaBackport registers these under minecraft:, so PCF treats them as vanilla and
          # sends them unwrapped; Velocity only knows the real 1.20.1 ids and fails to decode
          forceWrappedArguments = ["minecraft:team_color", "minecraft:hex_color"]
          forceWrapVanillaArguments = false

          [debug]
          enabled = false
          disabledMixins = []

          [advanced]
          modernForwardingVersion = "NO_OVERRIDE"
