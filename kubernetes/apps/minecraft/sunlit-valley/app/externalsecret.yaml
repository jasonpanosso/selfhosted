---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sunlit-valley
spec:
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  refreshPolicy: Periodic
  refreshInterval: 1h
  data:
    - secretKey: MINECRAFT_COBBLEMON_RCON_PASSWORD
      remoteRef:
        key: MINECRAFT_COBBLEMON_RCON_PASSWORD
    - secretKey: CURSEFORGE_API_KEY
      remoteRef:
        key: CURSEFORGE_API_KEY
    - secretKey: MINECRAFT_PROXY_SECRET
      remoteRef:
        key: MINECRAFT_PROXY_SECRET
  target:
    name: sunlit-valley
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        MINECRAFT_COBBLEMON_RCON_PASSWORD: "{{ .MINECRAFT_COBBLEMON_RCON_PASSWORD }}"
        CURSEFORGE_API_KEY: "{{ .CURSEFORGE_API_KEY }}"
        # mounted into /config; itzg copies it to /data/config on start
        proxy-compatible-forge.toml: |
          version = 2.0

          [forwarding]
          enabled = true
          mode = "MODERN"
          secret = {{ .MINECRAFT_PROXY_SECRET | toJson }}
          approvedProxyHosts = []

          [crossStitch]
          enabled = true
          forceWrappedArguments = []
          forceWrapVanillaArguments = false

          [debug]
          enabled = false
          disabledMixins = []

          [advanced]
          modernForwardingVersion = "NO_OVERRIDE"
