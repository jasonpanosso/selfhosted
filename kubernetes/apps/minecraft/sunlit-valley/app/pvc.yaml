---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone/persistentvolumeclaim-v1.json
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: sunlit-valley
spec:
  # not ReadWriteOncePod: the Direct backup mover mounts the volume next to the server
  accessModes: [ReadWriteOnce]
  dataSourceRef:
    apiGroup: kopiur.home-operations.com
    kind: Restore
    name: sunlit-valley
  resources:
    requests:
      storage: 15Gi
  storageClassName: topolvm
