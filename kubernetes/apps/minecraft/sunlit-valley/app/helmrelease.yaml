---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app sunlit-valley
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  timeout: 10m0s
  upgrade:
    strategy:
      name: RemediateOnFailure
    remediation:
      remediateLastFailure: true
      retries: 2
  values:
    fullnameOverride: *app
    replicaCount: 1
    image:
      repository: ghcr.io/itzg/minecraft-server
      tag: 2026.10.1-java21@sha256:07ab333a8542208c4c863a78fd3cf3fd1138d5a2e118306e1a316d202f69ab74
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/arch
                  operator: In
                  values:
                    - amd64
    resources:
      requests:
        cpu: 500m
        memory: 4Gi
      limits:
        memory: 6Gi
    securityContext:
      runAsUser: 65534
      runAsGroup: 65534
      runAsNonRoot: true
      fsGroup: 65534
      readOnlyRootFilesystem: false
      seccompProfile:
        type: RuntimeDefault
    startupProbe:
      enabled: true
    extraEnv:
      TZ: America/Detroit
      USE_MEOWICE_FLAGS: "true"
      # sets PCF's forwarding secret on every start; PCF has no env or file option
      PATCH_DEFINITIONS: /patches
      CFG_PROXY_SECRET_FILE: /secrets/MINECRAFT_PROXY_SECRET
    persistence:
      dataDir:
        enabled: true
        existingClaim: *app
    extraVolumes:
      - volumeMounts:
          - name: forwarding-secret
            mountPath: /secrets
            readOnly: true
          - name: logs
            mountPath: /data/logs
          - name: crash-reports
            mountPath: /data/crash-reports
          - name: patches
            mountPath: /patches
            readOnly: true
      - volumes:
          - name: forwarding-secret
            secret:
              secretName: *app
          - name: logs
            emptyDir: {}
          - name: crash-reports
            emptyDir: {}
          - name: patches
            configMap:
              name: sunlit-valley-patches
    minecraftServer:
      eula: true
      version: 1.20.1
      type: AUTO_CURSEFORGE
      icon: https://i.imgur.com/xCwev3X.png
      # heap = 75% of the memory limit (-XX:MaxRAMPercentage)
      memory: "75%"
      serviceType: ClusterIP
      clusterIP: 10.96.0.42
      servicePort: 25565
      extraPorts:
        - name: voicechat
          protocol: UDP
          containerPort: 24454
          service:
            enabled: true
            embedded: true
            type: ClusterIP
            port: 24454
          ingress:
            enabled: false
      difficulty: normal
      levelType: normal
      spawnProtection: 0
      gameMode: survival
      pvp: default
      onlineMode: false
      whitelist: "Jayce"
      ops: "Jayce"
      motd: "pour one out for cobblemon academy"
      viewDistance: default
      pluginUrls:
        - https://cdn.modrinth.com/data/vDyrHl8l/versions/uRu4jaFs/proxy-compatible-forge-1.3.0.jar?mr_download_reason=standalone&mr_game_version=1.20.1&mr_loader=neoforge
        # simple voice chat for proxy plugin, all servers require it
        - https://cdn.modrinth.com/data/9eGKb6K1/versions/nHtyikTv/voicechat-forge-1.20.1-2.4.32.jar?mr_download_reason=standalone&mr_game_version=1.20.1&mr_loader=neoforge
      rcon:
        enabled: true
        existingSecret: *app
        secretKey: MINECRAFT_COBBLEMON_RCON_PASSWORD
      autoCurseForge:
        apiKey:
          existingSecret: *app
          secretKey: CURSEFORGE_API_KEY
        slug: society-sunlit-valley
        filenameMatcher: 3.4.3
        # BCC appends data to the status ping that Velocity can't decode, which
        # breaks ping passthrough (nanite/BetterCompatibilityChecker#37, not
        # fixed for 1.20.1)
        excludeMods:
          - better-compatibility-checker
        # re-evaluate exclusions against the existing install
        forceSynchronize: true

    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
