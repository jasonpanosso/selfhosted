---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app sunlit-valley-cobblemon
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  timeout: 10m0s
  upgrade:
    strategy:
      name: RemediateOnFailure
    remediation:
      remediateLastFailure: true
      retries: 2
  values:
    fullnameOverride: *app
    replicaCount: 1
    image:
      repository: ghcr.io/itzg/minecraft-server
      tag: 2026.8.2-java21@sha256:41041d799cee7743867f9a25bf12f2deeeb5a2392f3e4433d188cac4ad5e1e3a
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/arch
                  operator: In
                  values:
                    - amd64
    resources:
      requests:
        cpu: 2000m
        memory: 8Gi
    podSecurityContext:
      runAsUser: 65534
      runAsGroup: 65534
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
    startupProbe:
      enabled: true
    extraEnv:
      TZ: America/Detroit
      USE_MEOWICE_FLAGS: "true"
    persistence:
      dataDir:
        enabled: true
        existingClaim: *app
    extraVolumes:
      - volumeMounts:
          - name: forwarding-secret
            mountPath: /secrets
            readOnly: true
      - volumes:
          - name: forwarding-secret
            secret:
              secretName: *app
    minecraftServer:
      eula: true
      version: 1.20.1
      type: AUTO_CURSEFORGE
      icon: https://cdn2.steamgriddb.com/logo_thumb/804a8294a8f33203683b3e6ed46fe092.png
      memory: 8G
      serviceType: ClusterIP
      clusterIP: 10.96.0.40
      servicePort: 25565
      extraPorts:
        - name: voicechat
          protocol: UDP
          containerPort: 24454
          service:
            enabled: true
            embedded: true
            type: ClusterIP
            port: 24454
          ingress:
            enabled: false
      difficulty: normal
      levelType: normal
      spawnProtection: 0
      gameMode: survival
      pvp: default
      onlineMode: false
      whitelist: "Jayce"
      ops: "Jayce"
      motd: "GULP im dead lock in"
      viewDistance: default
      worldSaveName: sunlit-cobblemon
      pluginUrls:
        - https://cdn.modrinth.com/data/vDyrHl8l/versions/uRu4jaFs/proxy-compatible-forge-1.3.0.jar?mr_download_reason=standalone&mr_game_version=1.20.1&mr_loader=neoforge
        # simple voice chat for proxy plugin, all servers require it
        - https://cdn.modrinth.com/data/9eGKb6K1/versions/nHtyikTv/voicechat-forge-1.20.1-2.4.32.jar?mr_download_reason=standalone&mr_game_version=1.20.1&mr_loader=neoforge
      rcon:
        enabled: true
        existingSecret: *app
        secretKey: MINECRAFT_COBBLEMON_RCON_PASSWORD
      autoCurseForge:
        apiKey:
          existingSecret: *app
          secretKey: CURSEFORGE_API_KEY
        slug: society-sunlit-cobblemon
        filenameMatcher: "1.0.5-SSV4.0.8"

    mcbackup:
      enabled: true
      persistence:
        backupDir:
          existingClaim: sunlit-valley-cobblemon-backup

    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
