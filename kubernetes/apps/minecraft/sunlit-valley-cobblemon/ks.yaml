---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app sunlit-valley-cobblemon
  namespace: &namespace minecraft
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  postBuild:
    substituteFrom:
      - kind: Secret
        name: post-build-substitutions
    substitute:
      APP: *app
  path: ./kubernetes/apps/minecraft/sunlit-valley-cobblemon/app
  interval: 1h
  retryInterval: 2m
  timeout: 15m
  wait: false
  prune: true
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: *app
      namespace: *namespace
    - apiVersion: apps/v1
      kind: Deployment
      name: sunlit-valley-cobblemon-rcon
      namespace: *namespace
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  dependsOn:
    - name: secret-store
      namespace: external-secrets
    - name: gateway-api-crds
      namespace: kube-system
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: kopiur-repositories
      namespace: kopiur-system
    - name: topolvm
      namespace: topolvm-system
