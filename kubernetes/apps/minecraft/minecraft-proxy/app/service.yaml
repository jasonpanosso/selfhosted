---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone/service-v1.json
apiVersion: v1
kind: Service
metadata:
  name: &app minecraft-proxy
  labels:
    app.kubernetes.io/name: *app
  annotations:
    lbipam.cilium.io/ips: 192.168.21.42
    # velocity hosts
    external-dns.kubernetes.io/hostname: cobblemon.${domain}.${tld},botc.${domain}.${tld},sunlit-valley.${domain}.${tld}
    external-dns.kubernetes.io/target: kubernetes.${domain}.${tld}
spec:
  type: LoadBalancer
  ports:
    - name: proxy
      port: 25565
      targetPort: proxy
      protocol: TCP
    - name: voicechat
      port: 25577
      targetPort: voicechat
      protocol: UDP
  selector:
    app.kubernetes.io/name: *app
