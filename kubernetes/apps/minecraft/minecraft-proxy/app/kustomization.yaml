---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ./ciliumnetworkpolicy.yaml
  - ./deployment.yaml
  - ./externalsecret.yaml
  - ./service.yaml

configMapGenerator:
  - name: minecraft-proxy
    files:
      - velocity.toml=./resources/velocity.toml
      - minimotd-main.conf=./resources/minimotd/main.conf
      - minimotd-plugin_settings.conf=./resources/minimotd/plugin_settings.conf
      - minimotd-botc.conf=./resources/minimotd/extra-configs/botc.conf
      - minimotd-sunlit-valley.conf=./resources/minimotd/extra-configs/sunlit-valley.conf
      - minimotd-sunlit-valley-cobblemon.conf=./resources/minimotd/extra-configs/sunlit-valley-cobblemon.conf
      - minimotd-botc.png=./resources/minimotd/icons/botc.png
      - minimotd-sunlit-valley.png=./resources/minimotd/icons/sunlit-valley.png
      - minimotd-sunlit-valley-cobblemon.png=./resources/minimotd/icons/sunlit-valley-cobblemon.png
    options:
      disableNameSuffixHash: true
