---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ./deployment.yaml
  - ./externalsecret.yaml
  - ./service.yaml

configMapGenerator:
  - name: minecraft-proxy
    files:
      - velocity.toml=./resources/velocity.toml
    options:
      disableNameSuffixHash: true
