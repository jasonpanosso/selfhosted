---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/deployment-apps-v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: &app minecraft-proxy
  labels:
    app.kubernetes.io/name: *app
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: *app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: *app
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: copy-plugins
          image: docker.io/library/eclipse-temurin:25.0.5_8-jre-noble@sha256:23481dc33a759b79d62814ceb1ec27a0d1a84da9d7aab0609577427176fbb1b7
          command:
            - cp
            - /opt/plugins/ambassador/ambassador.jar
            - /opt/plugins/minimotd/minimotd.jar
            - /opt/plugins/tab/tab.jar
            - /opt/plugins/velocity-scoreboard-api/velocity-scoreboard-api.jar
            - /server/plugins/
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 64Mi
          securityContext: &securityContext
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: plugins
              mountPath: /server/plugins
            - name: ambassador
              mountPath: /opt/plugins/ambassador
              readOnly: true
            - name: minimotd-jar
              mountPath: /opt/plugins/minimotd
              readOnly: true
            - name: tab-jar
              mountPath: /opt/plugins/tab
              readOnly: true
            - name: velocity-scoreboard-api-jar
              mountPath: /opt/plugins/velocity-scoreboard-api
              readOnly: true
        - name: download-simple-voice-chat
          image: docker.io/curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
          command:
            - curl
            - --fail
            - --silent
            - --show-error
            - --location
            - --user-agent
            - jasonpanosso/selfhosted (https://github.com/jasonpanosso/selfhosted)
            - --output
            - /server/plugins/simple-voice-chat.jar
            - https://cdn.modrinth.com/data/9eGKb6K1/versions/Ue35nhwF/voicechat-velocity-2.6.26.jar
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 32Mi
          securityContext: *securityContext
          volumeMounts:
            - name: plugins
              mountPath: /server/plugins
        # MiniMOTD rewrites its config files on load, so they can't be read-only mounts
        # Velocity names the data directory after the plugin id, minimotd-velocity
        - name: copy-minimotd-config
          image: docker.io/library/eclipse-temurin:25.0.5_8-jre-noble@sha256:23481dc33a759b79d62814ceb1ec27a0d1a84da9d7aab0609577427176fbb1b7
          command:
            - cp
            - --recursive
            - --dereference
            - /opt/minimotd/main.conf
            - /opt/minimotd/plugin_settings.conf
            - /opt/minimotd/extra-configs
            - /opt/minimotd/icons
            - /server/plugins/minimotd-velocity/
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 64Mi
          securityContext: *securityContext
          volumeMounts:
            - name: minimotd
              mountPath: /server/plugins/minimotd-velocity
            - name: minimotd-config
              mountPath: /opt/minimotd
              readOnly: true
        # TAB inserts missing options into its config and saves it, so it can't be a read-only mount
        - name: copy-tab-config
          image: docker.io/library/eclipse-temurin:25.0.5_8-jre-noble@sha256:23481dc33a759b79d62814ceb1ec27a0d1a84da9d7aab0609577427176fbb1b7
          command:
            - cp
            - --dereference
            - /opt/tab/config.yml
            - /opt/tab/groups.yml
            - /server/plugins/tab/
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 64Mi
          securityContext: *securityContext
          volumeMounts:
            - name: tab
              mountPath: /server/plugins/tab
            - name: tab-config
              mountPath: /opt/tab
              readOnly: true
      containers:
        - name: *app
          image: docker.io/library/eclipse-temurin:25.0.5_8-jre-noble@sha256:23481dc33a759b79d62814ceb1ec27a0d1a84da9d7aab0609577427176fbb1b7
          workingDir: /server
          command:
            - java
            - -Xms256M
            - -Xmx256M
            - -XX:+UseZGC
            - -XX:+UseCompactObjectHeaders
            - -jar
            - /opt/velocity/velocity.jar
          env:
            - name: TZ
              value: America/Detroit
          ports:
            - name: proxy
              containerPort: 25577
              protocol: TCP
            - name: voicechat
              containerPort: 25577
              protocol: UDP
          startupProbe:
            tcpSocket:
              port: 25577
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe: &probes
            tcpSocket:
              port: 25577
            periodSeconds: 15
          readinessProbe: *probes
          resources:
            requests:
              cpu: 100m
              memory: 640Mi
            limits:
              memory: 640Mi
          securityContext: *securityContext
          volumeMounts:
            - name: server
              mountPath: /server
            - name: plugins
              mountPath: /server/plugins
            - name: minimotd
              mountPath: /server/plugins/minimotd-velocity
            - name: tab
              mountPath: /server/plugins/tab
            - name: velocity
              mountPath: /opt/velocity
              readOnly: true
            - name: config
              mountPath: /server/velocity.toml
              subPath: velocity.toml
              readOnly: true
            - name: forwarding-secret
              mountPath: /secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: server
          emptyDir: {}
        - name: velocity
          image:
            reference: ghcr.io/jasonpanosso/velocity:v4.3.1@sha256:35c286169631e0765d66644b34594c79b637e67f58e92759cc6f48aca188c8e3
            pullPolicy: IfNotPresent
        - name: plugins
          emptyDir: {}
        - name: minimotd
          emptyDir: {}
        - name: tab
          emptyDir: {}
        - name: ambassador
          image:
            reference: ghcr.io/jasonpanosso/ambassador:v1.4.5@sha256:5db19fe159f17636afeea22da8736a3509d188492b8aca03ffcb2b51e1919ed4
            pullPolicy: IfNotPresent
        - name: minimotd-jar
          image:
            reference: ghcr.io/jasonpanosso/minimotd-velocity:v2.2.5@sha256:cebc738f11b1fd544dfa8789eacb4f721f19ff1ab90b0e4e97624d54bf386634
            pullPolicy: IfNotPresent
        - name: tab-jar
          image:
            reference: ghcr.io/jasonpanosso/tab-velocity:6.2.1@sha256:d51989069fee4f42130448973aa031b4f43b4184b2b330521b59f658c79c146a
            pullPolicy: IfNotPresent
        - name: velocity-scoreboard-api-jar
          image:
            reference: ghcr.io/jasonpanosso/velocity-scoreboard-api:2.1.1@sha256:185b7006f7fac532ae6fec9b52befcaff48bde8e1750850675f6cfc718e98465
            pullPolicy: IfNotPresent
        - name: tmp
          emptyDir: {}
        - name: config
          configMap:
            name: *app
        - name: minimotd-config
          configMap:
            name: *app
            items:
              - key: minimotd-main.conf
                path: main.conf
              - key: minimotd-plugin_settings.conf
                path: plugin_settings.conf
              - key: minimotd-botc.conf
                path: extra-configs/botc.conf
              - key: minimotd-sunlit-valley.conf
                path: extra-configs/sunlit-valley.conf
              - key: minimotd-sunlit-valley-cobblemon.conf
                path: extra-configs/sunlit-valley-cobblemon.conf
              - key: minimotd-botc.png
                path: icons/botc.png
              - key: minimotd-sunlit-valley.png
                path: icons/sunlit-valley.png
              - key: minimotd-sunlit-valley-cobblemon.png
                path: icons/sunlit-valley-cobblemon.png
        - name: tab-config
          configMap:
            name: *app
            items:
              - key: tab-config.yml
                path: config.yml
              - key: tab-groups.yml
                path: groups.yml
        - name: forwarding-secret
          secret:
            secretName: *app
