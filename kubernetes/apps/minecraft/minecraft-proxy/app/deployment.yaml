---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/deployment-apps-v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: &app minecraft-proxy
  labels:
    app.kubernetes.io/name: *app
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: *app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: *app
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: copy-plugins
          image: docker.io/library/eclipse-temurin:25.0.5_8-jre-noble@sha256:e3b6f7887a50f20d8f07abf279d8a81a5953fb398a9555bd9edd56b9bd15968c
          command:
            - cp
            - /opt/plugins/ambassador/ambassador.jar
            - /server/plugins/
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 64Mi
          securityContext: &securityContext
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: plugins
              mountPath: /server/plugins
            - name: ambassador
              mountPath: /opt/plugins/ambassador
              readOnly: true
        - name: download-simple-voice-chat
          image: docker.io/curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
          command:
            - curl
            - --fail
            - --silent
            - --show-error
            - --location
            - --user-agent
            - jasonpanosso/selfhosted (https://github.com/jasonpanosso/selfhosted)
            - --output
            - /server/plugins/simple-voice-chat.jar
            - https://cdn.modrinth.com/data/9eGKb6K1/versions/Ue35nhwF/voicechat-velocity-2.6.26.jar
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 32Mi
          securityContext: *securityContext
          volumeMounts:
            - name: plugins
              mountPath: /server/plugins
      containers:
        - name: *app
          image: docker.io/library/eclipse-temurin:25.0.5_8-jre-noble@sha256:e3b6f7887a50f20d8f07abf279d8a81a5953fb398a9555bd9edd56b9bd15968c
          workingDir: /server
          command:
            - java
            - -Xms256M
            - -Xmx256M
            - -XX:+UseZGC
            - -XX:+UseCompactObjectHeaders
            - -jar
            - /opt/velocity/velocity.jar
          env:
            - name: TZ
              value: America/Detroit
          ports:
            - name: proxy
              containerPort: 25577
              protocol: TCP
            - name: voicechat
              containerPort: 25577
              protocol: UDP
          startupProbe:
            tcpSocket:
              port: 25577
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe: &probes
            tcpSocket:
              port: 25577
            periodSeconds: 15
          readinessProbe: *probes
          resources:
            requests:
              cpu: 100m
              memory: 640Mi
            limits:
              memory: 640Mi
          securityContext: *securityContext
          volumeMounts:
            - name: server
              mountPath: /server
            - name: plugins
              mountPath: /server/plugins
            - name: velocity
              mountPath: /opt/velocity
              readOnly: true
            - name: config
              mountPath: /server/velocity.toml
              subPath: velocity.toml
              readOnly: true
            - name: forwarding-secret
              mountPath: /secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: server
          emptyDir: {}
        - name: velocity
          image:
            reference: ghcr.io/jasonpanosso/velocity:v4.3.1@sha256:164bc0dc3aea477f9dfa068fce43072b92f4aafa491f41d010f194dd0991ef60
            pullPolicy: IfNotPresent
        - name: plugins
          emptyDir: {}
        - name: ambassador
          image:
            reference: ghcr.io/jasonpanosso/ambassador:1.4.5@sha256:039a867267dba134727ddd60d244ea728b461e2c0abb32a432073fcb6a44416f
            pullPolicy: IfNotPresent
        - name: tmp
          emptyDir: {}
        - name: config
          configMap:
            name: *app
        - name: forwarding-secret
          secret:
            secretName: *app
