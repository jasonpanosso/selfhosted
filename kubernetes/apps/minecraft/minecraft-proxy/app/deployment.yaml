---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone/deployment-apps-v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: &app minecraft-proxy
  labels:
    app.kubernetes.io/name: *app
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: *app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: *app
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: copy-plugins
          image: docker.io/library/eclipse-temurin:25.0.5_8-jre-noble@sha256:e3b6f7887a50f20d8f07abf279d8a81a5953fb398a9555bd9edd56b9bd15968c
          command:
            - cp
            - /opt/plugins/ambassador/ambassador.jar
            - /opt/plugins/simple-voice-chat/simple-voice-chat.jar
            - /server/plugins/
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext: &securityContext
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: plugins
              mountPath: /server/plugins
            - name: ambassador
              mountPath: /opt/plugins/ambassador
              readOnly: true
            - name: simple-voice-chat
              mountPath: /opt/plugins/simple-voice-chat
              readOnly: true
      containers:
        - name: *app
          image: docker.io/library/eclipse-temurin:25.0.5_8-jre-noble@sha256:e3b6f7887a50f20d8f07abf279d8a81a5953fb398a9555bd9edd56b9bd15968c
          workingDir: /server
          command:
            - java
            - -Xms256M
            - -Xmx256M
            - -XX:+UseZGC
            - -XX:+UseCompactObjectHeaders
            - -jar
            - /opt/velocity/velocity.jar
          env:
            - name: TZ
              value: America/Detroit
          ports:
            - name: proxy
              containerPort: 25577
              protocol: TCP
            - name: voicechat
              containerPort: 25577
              protocol: UDP
          startupProbe:
            tcpSocket:
              port: 25577
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe: &probes
            tcpSocket:
              port: 25577
            periodSeconds: 15
          readinessProbe: *probes
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 512Mi
          securityContext: *securityContext
          volumeMounts:
            - name: server
              mountPath: /server
            - name: plugins
              mountPath: /server/plugins
            - name: velocity
              mountPath: /opt/velocity
              readOnly: true
            - name: config
              mountPath: /server/velocity.toml
              subPath: velocity.toml
              readOnly: true
            - name: forwarding-secret
              mountPath: /secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: server
          emptyDir: {}
        - name: velocity
          image:
            reference: ghcr.io/jasonpanosso/velocity:v4.3.1@sha256:9e35ed70fc2d222c0547e0216b6a7b127b5d728ace01b2a9a074e2b104b1f8e7
            pullPolicy: IfNotPresent
        - name: plugins
          emptyDir: {}
        - name: ambassador
          image:
            reference: ghcr.io/jasonpanosso/ambassador:1.4.5@sha256:4e2cfb0f37758bdc4c89dcad88ca13e76b52c318b2b4ee1b1fbe9b58ba6e15b8
            pullPolicy: IfNotPresent
        - name: simple-voice-chat
          image:
            reference: ghcr.io/jasonpanosso/simple-voice-chat:velocity-2.6.26@sha256:ef414cc24074a3c80d473f68ad7c8a323613c04e1ba47953f188b5f5167ddedd
            pullPolicy: IfNotPresent
        - name: tmp
          emptyDir: {}
        - name: config
          configMap:
            name: *app
        - name: forwarding-secret
          secret:
            secretName: *app
