---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone/job-batch-v1.json
apiVersion: batch/v1
kind: Job
metadata:
  name: &app media-copy
spec:
  backoffLimit: 2
  template:
    spec:
      # root so rsync can preserve ownership; no fsGroup, so kubelet never
      # chowns either volume.
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: *app
          image: docker.io/library/alpine:3.24@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
          command: [/bin/sh, -c]
          # /volumes is Rook's csi subvolume group on mediafs; excluded so
          # --delete never touches it.
          args:
            - >-
              apk add --no-cache rsync &&
              rsync -aH --numeric-ids --delete --exclude=/volumes --info=stats2 /src/ /dst/
          volumeMounts:
            - name: src
              mountPath: /src
              readOnly: true
            - name: dst
              mountPath: /dst
      volumes:
        - name: src
          persistentVolumeClaim:
            claimName: media
            readOnly: true
        - name: dst
          persistentVolumeClaim:
            claimName: media-copy
      restartPolicy: Never
