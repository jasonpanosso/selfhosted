---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/deployment-apps-v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: &app prowlarr
  labels:
    app.kubernetes.io/name: *app
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: *app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: *app
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - image: ghcr.io/home-operations/prowlarr:3.0.2.5780@sha256:58fa5dbed20738ce0a72077315e818eeb731cb4b4a5173c4a837d343a9573750
          name: *app
          env:
            - name: PROWLARR__POSTGRES__USER
              valueFrom:
                secretKeyRef:
                  name: prowlarr-db
                  key: username
            - name: PROWLARR__POSTGRES__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: prowlarr-db
                  key: password
            - name: PROWLARR__AUTH__APIKEY
              valueFrom:
                secretKeyRef:
                  name: prowlarr
                  key: token
            - name: PROWLARR__LOG__DBENABLED
              value: "False"
            # crash reports and telemetry
            - name: PROWLARR__LOG__ANALYTICSENABLED
              value: "False"
            - name: PROWLARR__APP__INSTANCENAME
              value: Prowlarr
            - name: PROWLARR__AUTH__METHOD
              value: External
            - name: PROWLARR__AUTH__REQUIRED
              value: Enabled
            - name: PROWLARR__SERVER__BINDADDRESS
              value: "*"
            - name: PROWLARR__SERVER__ALLOWEDHOSTS
              value: prowlarr.${domain}.${tld},prowlarr,prowlarr.servarr.svc.cluster.local
            - name: PROWLARR__UPDATE__MECHANISM
              value: Docker
            - name: PROWLARR__UPDATE__BRANCH
              value: master
            - name: PROWLARR__POSTGRES__HOST
              value: pgcluster-rw.db.svc.cluster.local
            - name: PROWLARR__POSTGRES__MAINDB
              value: prowlarr
            - name: TZ
              value: Etc/UTC
          ports:
            - containerPort: 9696
              name: http
          # handle pg going down without failing liveness
          livenessProbe:
            tcpSocket:
              port: 9696
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ping
              port: 9696
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 1
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /ping
              port: 9696
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 10
            failureThreshold: 30
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /config
            - name: scratch
              mountPath: /tmp
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: *app
        - name: scratch
          emptyDir: {}
