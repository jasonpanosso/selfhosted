---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: &app jellyfin
  labels:
    app.kubernetes.io/name: *app
spec:
  parentRefs:
    - name: cilium
      namespace: kube-system
      sectionName: https
  hostnames:
    - watch.${domain}.${tld}
  rules:
    - backendRefs:
        - name: *app
          port: 80
      timeouts:
        request: 0s
