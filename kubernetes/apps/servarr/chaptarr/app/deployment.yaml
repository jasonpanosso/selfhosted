---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/deployment-apps-v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: &app chaptarr
  labels:
    app.kubernetes.io/name: *app
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: *app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: *app
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - image: docker.io/chaptarr/chaptarr:0.9.1000@sha256:bacb27cc04abe1900412df45ad5ad4e392368fe3e783012824b2ad768c72daa1
          name: *app
          env:
            - name: CHAPTARR__AUTH__APIKEY
              valueFrom:
                secretKeyRef:
                  name: chaptarr
                  key: token
            - name: CHAPTARR__LOG__LEVEL
              value: info
            - name: CHAPTARR__APP__INSTANCENAME
              value: Chaptarr
            - name: CHAPTARR__AUTH__METHOD
              value: External
            - name: CHAPTARR__AUTH__REQUIRED
              value: Enabled
            - name: CHAPTARR__SERVER__BINDADDRESS
              value: "*"
            - name: CHAPTARR__SERVER__PORT
              value: "8789"
            - name: CHAPTARR__SERVER__ALLOWEDHOSTS
              value: chaptarr.${domain}.${tld},chaptarr,chaptarr.servarr.svc.cluster.local
            - name: CHAPTARR__UPDATE__MECHANISM
              value: Docker
            - name: CHAPTARR__UPDATE__BRANCH
              value: main
            - name: TZ
              value: Etc/UTC
          ports:
            - containerPort: 8789
              name: http
          livenessProbe:
            tcpSocket:
              port: 8789
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 1
            failureThreshold: 3
          # the kubelet sends the pod IP as Host, which AllowedHosts rejects
          readinessProbe:
            httpGet:
              path: /ping
              port: 8789
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 1
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /ping
              port: 8789
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 10
            failureThreshold: 30
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /config
            - name: cache
              mountPath: /config/MediaCover
            - name: media
              mountPath: /data
            - name: scratch
              mountPath: /tmp
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: media
        - name: config
          persistentVolumeClaim:
            claimName: *app
        - name: cache
          persistentVolumeClaim:
            claimName: chaptarr-cache
        - name: scratch
          emptyDir: {}
