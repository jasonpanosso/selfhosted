---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone/deployment-apps-v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: &app home-assistant
  labels:
    app.kubernetes.io/name: *app
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: *app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: *app
      annotations:
        k8s.v1.cni.cncf.io/networks: |-
          [{"name": "iot", "namespace": "kube-system", "interface": "net1", "ips": ["192.168.40.12/24"], "mac": "02:00:00:00:40:12"}]
    spec:
      # IoT VLAN for OTBR, ESPHome and mDNS discovery
      nodeSelector:
        network.home.internal/vlan40: "true"
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # HA listens on 127.0.0.1 only (http listen addr only configurable in UI)
        # forward eth0 to it so 8123 stays off net1, where cilium policy doesn't apply
        - name: eth0-proxy
          image: &image ghcr.io/home-operations/home-assistant:2026.10.4@sha256:81271a8bbe2a6019659e9d5cde98b884dd0d67fad6819bb4ab177dceb0c1c5e1
          restartPolicy: Always
          command: [socat]
          args:
            - TCP4-LISTEN:8123,bind=$(POD_IP),fork,reuseaddr
            - TCP4:127.0.0.1:8123
          ports:
            - containerPort: 8123
              name: http
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 128Mi
          securityContext: &securityContext
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      containers:
        - image: *image
          name: *app
          env:
            # auth_oidc client_secret in configuration.yaml
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: *app
                  key: OIDC_CLIENT_SECRET
          startupProbe:
            httpGet: &httpGet
              path: /
              port: 8123
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe: &probes
            httpGet: *httpGet
            periodSeconds: 15
          readinessProbe: *probes
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
          securityContext: *securityContext
          volumeMounts:
            - name: data
              mountPath: /config
            - name: config
              mountPath: /config/configuration.yaml
              subPath: configuration.yaml
              readOnly: true
            - name: auth-oidc
              mountPath: /config/custom_components/auth_oidc
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: *app
        - name: config
          configMap:
            name: *app
        - name: auth-oidc
          image:
            reference: ghcr.io/jasonpanosso/auth-oidc:v1.2.1@sha256:8dbfff5d5e21969f7609bf0cb4282069797269c8a2f6a702f7b2b64e57fbbfb1
            pullPolicy: IfNotPresent
        - name: tmp
          emptyDir: {}
