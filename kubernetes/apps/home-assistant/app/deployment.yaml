---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone/deployment-apps-v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: &app home-assistant
  labels:
    app.kubernetes.io/name: *app
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: *app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: *app
      # IoT VLAN
      annotations:
        k8s.v1.cni.cncf.io/networks: |-
          [{"name": "iot", "namespace": "kube-system", "interface": "net1", "ips": ["192.168.40.12/24"], "mac": "02:00:00:00:40:12"}]
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        network.home.internal/vlan40: "true"
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: Always
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - image: ghcr.io/home-operations/home-assistant:2026.11.1@sha256:c129b1e4190273254d93d413fe2a083233c9202d84cb08f84dddb01861df432e
          name: *app
          ports:
            - containerPort: 8123
              name: http
          env:
            # auth_oidc client_secret in configuration.yaml
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: *app
                  key: OIDC_CLIENT_SECRET
          startupProbe:
            httpGet: &httpGet
              path: /
              port: 8123
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe: &probes
            httpGet: *httpGet
            periodSeconds: 15
          readinessProbe: *probes
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: data
              mountPath: /config
            - name: config
              mountPath: /config/configuration.yaml
              subPath: configuration.yaml
              readOnly: true
            - name: auth-oidc
              mountPath: /config/custom_components/auth_oidc
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: *app
        - name: config
          configMap:
            name: *app
        - name: auth-oidc
          image:
            reference: ghcr.io/jasonpanosso/auth-oidc:v1.2.1@sha256:debec7be0c40dcffd930a537d9feee79516449afa1f9caf955bcbf058b59fb88
            pullPolicy: IfNotPresent
        - name: tmp
          emptyDir: {}
