---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: &app home-assistant
  labels:
    app.kubernetes.io/name: *app
spec:
  parentRefs:
    - name: cilium
      namespace: kube-system
      sectionName: https
  hostnames:
    - hass.${domain}.${tld}
  rules:
    - filters:
        - type: ExternalAuth
          externalAuth:
            protocol: HTTP
            backendRef:
              name: authelia
              namespace: auth
              port: 80
            http:
              path: /api/authz/ext-authz/
              allowedHeaders:
                - accept
                - cookie
                - x-forwarded-proto
                - x-requested-with
              allowedResponseHeaders:
                - Remote-User
                - Remote-Name
                - Remote-Groups
                - Remote-Email
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-For
                value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
      backendRefs:
        - name: *app
          port: 8123
      timeouts:
        request: 0s
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: home-assistant-internal
  labels:
    app.kubernetes.io/name: &app home-assistant
spec:
  parentRefs:
    - name: cilium-internal
      namespace: kube-system
      sectionName: https
  hostnames:
    - hass.home.${domain}.${tld}
  rules:
    # no auth on HA's side (prometheus: requires_auth: false)
    - matches:
        - path:
            type: PathPrefix
            value: /api/prometheus
      filters:
        - type: ExternalAuth
          externalAuth:
            protocol: HTTP
            backendRef:
              name: authelia
              namespace: auth
              port: 80
            http:
              path: /api/authz/ext-authz/
              allowedHeaders:
                - accept
                - cookie
                - x-forwarded-proto
                - x-requested-with
              allowedResponseHeaders:
                - Remote-User
                - Remote-Name
                - Remote-Groups
                - Remote-Email
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-For
                value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
      backendRefs:
        - name: *app
          port: 8123
      timeouts:
        request: 0s
    # HA's own login (auth_oidc, companion app)
    - filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-For
                value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
            remove:
              - Remote-User
              - Remote-Name
              - Remote-Groups
              - Remote-Email
      backendRefs:
        - name: *app
          port: 8123
      timeouts:
        request: 0s
