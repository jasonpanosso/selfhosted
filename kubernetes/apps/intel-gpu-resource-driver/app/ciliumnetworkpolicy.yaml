---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: intel-gpu-resource-driver
spec:
  endpointSelector:
    matchLabels:
      app: intel-gpu-resource-driver
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    # kubelet health probe
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "51516"
              protocol: TCP
