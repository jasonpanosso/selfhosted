---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/opentelemetry.io/opentelemetrycollector_v1beta1.json
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: node
spec:
  mode: daemonset
  serviceAccount: otel-node-collector
  priorityClassName: system-node-critical
  # root so the collector can write its state dir on the hostPath, which kubelet creates as root:root 0755;
  # the user namespace maps it to an unprivileged UID on the host (needs user.max_user_namespaces in talos/common.yaml)
  hostUsers: false
  podSecurityContext:
    runAsUser: 0
    runAsGroup: 0
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 512Mi
  env:
    - name: GOMEMLIMIT
      value: 400MiB
    - name: OTEL_RESOURCE_ATTRIBUTES
      value: "k8s.cluster.name=prod"
    - name: OTEL_K8S_NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
  tolerations:
    - operator: Exists
      effect: NoSchedule
  nodeSelector:
    kubernetes.io/os: linux
  config:
    extensions:
      # persists file_log offsets and the exporter queue across collector restarts
      file_storage:
        directory: /var/lib/otelcol
        compaction:
          directory: /var/lib/otelcol
          on_start: true
          on_rebound: true

    exporters:
      debug/metrics: {}
      debug/logs: {}
      debug/traces: {}
      otlp_http/victoria-logs:
        logs_endpoint: http://victoria-logs.observability.svc.cluster.local:9428/insert/opentelemetry/v1/logs
        tls:
          insecure: true
        # retry until victoria-logs is back
        retry_on_failure:
          enabled: true
          max_elapsed_time: 0
        sending_queue:
          enabled: true
          storage: file_storage
          sizer: bytes
          queue_size: 268435456 # 256MiB on /var per node
          # batching in the exporter instead of the batch processor, which acks
          # upstream before export and drops when the queue is full
          batch:
            sizer: items
            min_size: 1000
            max_size: 1500
            flush_timeout: 1s

    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 15
      resource_detection/env:
        detectors: [env]
        timeout: 2s
        override: false
      k8s_attributes:
        filter:
          node_from_env_var: OTEL_K8S_NODE_NAME
        passthrough: false
        extract:
          otel_annotations: true
          labels:
            - from: pod
              key: app.kubernetes.io/name
              tag_name: service.name
            - from: pod
              key: k8s-app
              tag_name: service.name
            - from: pod
              key: app.kubernetes.io/instance
              tag_name: k8s.app.instance
            - from: pod
              key: app.kubernetes.io/version
              tag_name: service.version
            - from: pod
              key: app.kubernetes.io/component
              tag_name: k8s.app.component
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.node.name
            - k8s.pod.start_time
            - k8s.deployment.name
            - k8s.replicaset.name
            - k8s.replicaset.uid
            - k8s.daemonset.name
            - k8s.daemonset.uid
            - k8s.job.name
            - k8s.job.uid
            - k8s.container.name
            - k8s.cronjob.name
            - k8s.statefulset.name
            - k8s.statefulset.uid
            - container.image.tags
            - container.image.name
            - k8s.cluster.uid
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: resource_attribute
                name: k8s.pod.name
              - from: resource_attribute
                name: k8s.namespace.name
              - from: resource_attribute
                name: k8s.node.name
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
          - sources:
              - from: resource_attribute
                name: k8s.pod.name
              - from: resource_attribute
                name: k8s.namespace.name
          - sources:
              - from: connection

    receivers:
      file_log:
        exclude: []
        include:
          - /var/log/pods/*/*/*.log
        include_file_name: false
        include_file_path: true
        operators:
          - id: container-parser
            max_log_size: 102400
            type: container
        retry_on_failure:
          enabled: true
          max_elapsed_time: 0
        start_at: end
        storage: file_storage

    service:
      extensions:
        - file_storage
      pipelines:
        logs:
          receivers:
            - file_log
          processors:
            - memory_limiter
            - k8s_attributes
            - resource_detection/env
          exporters:
            # - debug/logs
            - otlp_http/victoria-logs
  volumeMounts:
    - mountPath: /var/log/pods
      name: varlogpods
      readOnly: true
    - mountPath: /var/lib/otelcol
      name: varlibotelcol
  volumes:
    - hostPath:
        path: /var/log/pods
      name: varlogpods
    - hostPath:
        path: /var/lib/otelcol
        type: DirectoryOrCreate
      name: varlibotelcol
