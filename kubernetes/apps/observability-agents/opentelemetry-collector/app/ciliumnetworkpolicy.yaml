---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: node-collector
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: opentelemetry-collector
      app.kubernetes.io/instance: observability-agents.node
  # vmagent scrape of 8888 covered by baseline policy
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    # Talos service and kernel logs over the hostPorts; only this node's host, not the LAN
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "6050"
              protocol: TCP
            - port: "6051"
              protocol: TCP
  egress:
    # otlp_http/victoria-logs exporter
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: victoria-logs-single
      toPorts:
        - ports:
            - port: "9428"
              protocol: TCP
