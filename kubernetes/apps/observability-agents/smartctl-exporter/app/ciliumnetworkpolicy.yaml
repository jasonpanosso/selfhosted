---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: smartctl-exporter
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus-smartctl-exporter
  enableDefaultDeny:
    ingress: true
    egress: true
  # vmagent scrape covered by baseline policy
  ingress:
    - {}
  egress:
    - {}
