---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: smartctl-exporter-rules
spec:
  groups:
    - name: smartctl-exporter.rules
      rules:
        # SSDs and NVMe; HDDs have their own lower limit below
        - alert: SmartDeviceHighTemperature
          expr: |
            smartctl_device_temperature{temperature_type="current"} > 80
              unless on (instance, device) (smartctl_device_rotation_rate > 0)
          for: 5m
          annotations:
            summary: >-
              Mounted drive {{ $labels.device }} on device {{ $labels.instance }} has a temperature higher than 80°C
          labels:
            severity: critical

        # rotation_rate only exists for spinning drives
        - alert: SmartHddHighTemperature
          expr: |
            smartctl_device_temperature{temperature_type="current"} > 55
              and on (instance, device) (smartctl_device_rotation_rate > 0)
          for: 15m
          annotations:
            summary: >-
              Hard drive {{ $labels.device }} on device {{ $labels.instance }} has been above 55°C for 15m ({{ $value }}°C)
          labels:
            severity: critical

        - alert: SmartDeviceTestFailed
          expr: |
            smartctl_device_smart_status != 1
          for: 5m
          annotations:
            summary: >-
              Mounted drive {{ $labels.device }} on device {{ $labels.instance }} did not pass its SMART test
          labels:
            severity: critical

        - alert: SmartDeviceCriticalWarning
          expr: |
            smartctl_device_critical_warning != 0
          for: 5m
          annotations:
            summary: >-
              Mounted drive {{ $labels.device }} on device {{ $labels.instance }} is in a critical state
          labels:
            severity: critical

        - alert: SmartDeviceMediaErrors
          expr: |
            smartctl_device_media_errors != 0
          for: 5m
          annotations:
            summary: >-
              Mounted drive {{ $labels.device }} on device {{ $labels.instance }} has media errors
          labels:
            severity: critical

        - alert: SmartDeviceAvailableSpareUnderThreadhold
          expr: |
            smartctl_device_available_spare_threshold > smartctl_device_available_spare
          for: 5m
          annotations:
            summary: >-
              Device {{ $labels.device }} on instance {{ $labels.instance }} is under available spare threashold
          labels:
            severity: critical

        - alert: SmartDeviceInterfaceSlow
          expr: |
            smartctl_device_interface_speed{speed_type="current"} != on(device, instance, namespace, pod) smartctl_device_interface_speed{speed_type="max"}
          annotations:
            summary: >-
              Device {{ $labels.device }} on instance {{ $labels.instance }} interface is slower then it should be
          for: 5m
          labels:
            severity: critical

        # SATA (ATA) only; NVMe reports media_errors and available_spare instead
        - alert: SmartDeviceBadSectors
          expr: |
            smartctl_device_attribute{attribute_name=~"Reallocated_Sector_Ct|Current_Pending_Sector|Offline_Uncorrectable", attribute_value_type="raw"} > 0
          for: 5m
          annotations:
            summary: >-
              Drive {{ $labels.device }} on device {{ $labels.instance }} has {{ $value }} {{ $labels.attribute_name }}
          labels:
            severity: warning

        # NVMe endurance estimate; 100 = rated write endurance used up
        - alert: SmartDeviceWearHigh
          expr: |
            smartctl_device_percentage_used > 80
          for: 1h
          annotations:
            summary: >-
              Drive {{ $labels.device }} on device {{ $labels.instance }} has used {{ $value }}% of its rated endurance
          labels:
            severity: warning
