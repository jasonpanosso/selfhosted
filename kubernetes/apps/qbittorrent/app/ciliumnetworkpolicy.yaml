---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
# only covers eth0 (net1 is the VPN macvlan). eth0 egress is CoreDNS only, so nothing leaks if net1 is down
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: qbittorrent
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: qbittorrent
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    # cilium gateway envoy
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: qui
            app.kubernetes.io/name: qui
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    # eth0 needs CoreDNS
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
