---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: lldap
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: lldap
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    # cilium gateway envoy
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "17170"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: auth
            app.kubernetes.io/name: authelia
      toPorts:
        - ports:
            - port: "3890"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: lldap-bootstrap
      toPorts:
        - ports:
            - port: "17170"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: db
            app.kubernetes.io/name: postgresql
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # toFQDNs only learns IPs from DNS that goes through the proxy
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # SMTP for password resets
    - toFQDNs:
        - matchName: smtp.resend.com
      toPorts:
        - ports:
            - port: "587"
              protocol: TCP
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: lldap-bootstrap
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: lldap-bootstrap
  enableDefaultDeny:
    ingress: true
    egress: true
  # DNS comes from the baseline CCNP
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: lldap
      toPorts:
        - ports:
            - port: "17170"
              protocol: TCP
