---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lldap-db
spec:
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  refreshPolicy: Periodic
  refreshInterval: 1h
  data:
    - secretKey: username
      remoteRef:
        key: LLDAP_DB_USERNAME
    - secretKey: password
      remoteRef:
        key: LLDAP_DB_PASSWORD
  target:
    name: lldap-db
    creationPolicy: Owner
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lldap
spec:
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  refreshPolicy: Periodic
  refreshInterval: 1h
  data:
    - secretKey: LLDAP_JWT_SECRET
      remoteRef:
        key: LLDAP_JWT_SECRET
    - secretKey: LLDAP_KEY_SEED
      remoteRef:
        key: LLDAP_KEY_SEED
    - secretKey: LLDAP_ADMIN_PASSWORD
      remoteRef:
        key: LLDAP_ADMIN_PASSWORD
    - secretKey: SMTP_USERNAME
      remoteRef:
        key: SMTP_USERNAME
    - secretKey: SMTP_PASSWORD
      remoteRef:
        key: SMTP_PASSWORD
  target:
    name: lldap
    creationPolicy: Owner
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lldap-bootstrap
spec:
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  refreshPolicy: Periodic
  refreshInterval: 1h
  data:
    - secretKey: LLDAP_ADMIN_PASSWORD
      remoteRef:
        key: LLDAP_ADMIN_PASSWORD
    - secretKey: AUTHELIA_LDAP_PASSWORD
      remoteRef:
        key: AUTHELIA_LDAP_PASSWORD
  target:
    name: lldap-bootstrap
    creationPolicy: Owner
