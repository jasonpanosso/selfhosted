---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &app rcon-web-admin
spec:
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  refreshPolicy: Periodic
  refreshInterval: 1h
  data:
    - secretKey: MINECRAFT_COBBLEMON_RCON_PASSWORD
      remoteRef:
        key: MINECRAFT_COBBLEMON_RCON_PASSWORD
  target:
    name: *app
    creationPolicy: Owner
    template:
      engineVersion: v2
      # copied over db/servers.json on every start; ids match the existing
      # per-server db/server_<id> directories
      data:
        servers.json: |
          {
            "a836f5f84b638e90ff7dca46a3d271e7": {
              "id": "a836f5f84b638e90ff7dca46a3d271e7",
              "game": "minecraft",
              "name": "cobblemon",
              "host": "sunlit-valley-cobblemon-rcon.minecraft.svc.cluster.local",
              "users": ["jason"],
              "web": false,
              "active": true,
              "rcon_port": 25575,
              "rcon_password": {{ .MINECRAFT_COBBLEMON_RCON_PASSWORD | toJson }}
            },
            "e2df97c7a288b6e8677074085577519f": {
              "id": "e2df97c7a288b6e8677074085577519f",
              "game": "minecraft",
              "name": "Sunlit Valley",
              "host": "sunlit-valley-rcon.minecraft.svc.cluster.local",
              "users": ["jason"],
              "web": false,
              "active": true,
              "rcon_port": 25575,
              "rcon_password": {{ .MINECRAFT_COBBLEMON_RCON_PASSWORD | toJson }}
            },
            "9abb32f5c8547b395707fc486a417f3f": {
              "id": "9abb32f5c8547b395707fc486a417f3f",
              "game": "minecraft",
              "name": "botc",
              "host": "botc-rcon.minecraft.svc.cluster.local",
              "users": ["jason"],
              "web": false,
              "active": true,
              "rcon_port": 25575,
              "rcon_password": {{ .MINECRAFT_COBBLEMON_RCON_PASSWORD | toJson }}
            }
          }
