---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone/deployment-apps-v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: &app rcon-web-admin
  labels:
    app.kubernetes.io/name: *app
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: *app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: *app
    spec:
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # servers.json is declared in the ExternalSecret; edits made in the UI
        # are overwritten on restart. Each server keeps its widget state in
        # db/server_<id>, which the UI only creates for servers it adds.
        - name: copy-servers
          image: docker.io/itzg/rcon:latest@sha256:c9521f333bf9eaedf2db0acd750e67be88eaaa9c5e9026385bd875dc18a49110
          command:
            - /bin/sh
            - -c
            - >-
              cp /config/servers.json /opt/rcon-web-admin/db/servers.json &&
              mkdir -p
              /opt/rcon-web-admin/db/server_a836f5f84b638e90ff7dca46a3d271e7
              /opt/rcon-web-admin/db/server_e2df97c7a288b6e8677074085577519f
              /opt/rcon-web-admin/db/server_9abb32f5c8547b395707fc486a417f3f
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext: &securityContext
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: data
              mountPath: /opt/rcon-web-admin/db
            - name: servers
              mountPath: /config
              readOnly: true
      containers:
        - image: docker.io/itzg/rcon:latest@sha256:c9521f333bf9eaedf2db0acd750e67be88eaaa9c5e9026385bd875dc18a49110
          name: *app
          ports:
            - name: http
              containerPort: 4326
              protocol: TCP
            - name: ws
              containerPort: 4327
              protocol: TCP
          env:
            - name: RWA_WEBSOCKET_URL
              value: ws://rcon.${domain}.${tld}/websocket
            - name: RWA_WEBSOCKET_URL_SSL
              value: wss://rcon.${domain}.${tld}/websocket
          livenessProbe: &probes
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe: *probes
          resources:
            requests:
              cpu: 10m
              memory: 256Mi
            limits:
              memory: 256Mi
          securityContext: *securityContext
          volumeMounts:
            - name: data
              mountPath: /opt/rcon-web-admin/db
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: *app
        - name: servers
          secret:
            secretName: *app
