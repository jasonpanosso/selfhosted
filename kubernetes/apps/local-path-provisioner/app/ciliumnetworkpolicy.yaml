---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
# the provisioner only needs the API server and DNS, from the baseline policy; its
# helper pods have the same label and only touch host paths
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: local-path-provisioner
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: local-path-provisioner
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    # kubelet health probe
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
