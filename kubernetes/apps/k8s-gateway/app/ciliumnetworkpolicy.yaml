---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: k8s-gateway
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: k8s-gateway
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    # EdgeRouter dnsmasq forwarding, through the LoadBalancer service (DSR keeps the source address)
    - fromCIDR:
        - 192.168.20.1/32
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # kubelet health (8080) and readiness (8181) probes
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            - port: "8181"
              protocol: TCP
  # kube-apiserver egress comes from the baseline CCNP
  egress: []
