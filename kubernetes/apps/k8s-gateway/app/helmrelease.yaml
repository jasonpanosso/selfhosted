---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app k8s-gateway
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  upgrade:
    strategy:
      name: RemediateOnFailure
    remediation:
      remediateLastFailure: true
      retries: 2
  values:
    fullnameOverride: k8s-gateway
    replicaCount: 2

    # router forwards home.${domain}.${tld} here (dnsmasq server=/home.../192.168.21.53)
    serviceType: LoadBalancer
    service:
      annotations:
        lbipam.cilium.io/ips: 192.168.21.53

    # authoritative for home.${domain}.${tld} only
    servers:
      - zones:
          - zone: home.${domain}.${tld}.
            use_tcp: true
        port: 53
        plugins:
          - name: errors
          - name: health
            configBlock: |-
              lameduck 5s
          - name: ready
          - name: k8s_gateway
            parameters: home.${domain}.${tld}
            configBlock: |-
              resources HTTPRoute
              ttl 30
          - name: loadbalance

    podSecurityContext:
      runAsUser: 65532
      runAsGroup: 65532
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
      # bind :53 without NET_BIND_SERVICE
      sysctls:
        - name: net.ipv4.ip_unprivileged_port_start
          value: "53"
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]

    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        # chart default sets a cpu limit
        cpu: null
        memory: 64Mi

    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: k8s-gateway
                app.kubernetes.io/instance: k8s-gateway
            topologyKey: kubernetes.io/hostname
    podDisruptionBudget:
      maxUnavailable: 1
