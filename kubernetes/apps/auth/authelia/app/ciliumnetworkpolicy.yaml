---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: authelia
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: authelia
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    # ingress: portal and OIDC through the gateway.
    # the rest: envoy's ExtAuthz checks come from the node it runs on, not the ingress
    # identity, so blocking any of these breaks every route behind authelia
    - fromEntities:
        - ingress
        - host
        - remote-node
        - kube-apiserver
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    # metrics
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: vmagent
      toPorts:
        - ports:
            - port: "9959"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: dragonfly
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: lldap
            app.kubernetes.io/name: lldap
      toPorts:
        - ports:
            - port: "3890"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: db
            app.kubernetes.io/name: postgresql
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # toFQDNs only learns IPs from DNS that goes through the proxy
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # SMTP is checked at startup, so authelia may not boot without it
    - toFQDNs:
        - matchName: smtp.resend.com
      toPorts:
        - ports:
            - port: "587"
              protocol: TCP
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
# ingress comes from the operator's own NetworkPolicy, which cilium adds to this
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: dragonfly
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: dragonfly
  enableDefaultDeny:
    ingress: true
    egress: true
  egress:
    # replication
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: dragonfly
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
            - port: "9999"
              protocol: TCP
