---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/referencegrant_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: authelia-ext-authz-a-l
spec:
  # namespaces whose HTTPRoutes use authelia as an ExternalAuth backend (a-l).
  # spec.from allows at most 16 entries
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: autobrr
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: bookboss
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: filebrowser
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: home-assistant
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: kube-system
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: lldap
  to:
    - group: ""
      kind: Service
      name: authelia
---
