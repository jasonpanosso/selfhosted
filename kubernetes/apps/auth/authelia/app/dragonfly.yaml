---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/dragonflydb.io/dragonfly_v1alpha1.json
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: dragonfly
spec:
  args:
    - --proactor_threads=1
    # checks for releases daily and reports anonymous data; its network policy blocks this anyway
    - --version_check=false
    # sessions are ephemeral: no snapshot on shutdown (the root filesystem is read-only)
    - --dbfilename=
  authentication:
    passwordFromSecret:
      name: authelia
      key: REDIS_PASSWORD
  replicas: 2
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  resources:
    requests:
      cpu: 50m
      memory: 320Mi
    limits:
      memory: 320Mi
