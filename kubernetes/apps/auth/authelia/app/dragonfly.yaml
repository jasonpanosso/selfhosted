---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/dragonflydb.io/dragonfly_v1alpha1.json
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: dragonfly
spec:
  args:
    - --proactor_threads=1
    # checks for releases daily and reports anonymous data; its network policy blocks this anyway
    - --version_check=false
    # sessions are ephemeral: no snapshot on shutdown (the root filesystem is read-only)
    - --dbfilename=
  authentication:
    passwordFromSecret:
      name: authelia
      key: REDIS_PASSWORD
  replicas: 2
  # automountServiceAccountToken: false is set on the ServiceAccount
  serviceAccountName: dragonfly
  affinity:
    # worker-3/4 have no AVX2: a replica dies with "the root cause might be an old hardware" when its full sync starts
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                  - worker-3
                  - worker-4
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: dragonfly
          topologyKey: kubernetes.io/hostname
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  resources:
    requests:
      cpu: 50m
      memory: 320Mi
    limits:
      memory: 320Mi
