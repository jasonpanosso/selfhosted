---
theme: dark
server:
  address: tcp://0.0.0.0:80
  disable_healthcheck: true
  buffers:
    read: 16384
  endpoints:
    authz:
      ext-authz:
        implementation: ExtAuthz
        authn_strategies:
          - name: CookieSession
      # used by the jellyfin authelia plugin, which logs in via /api/firstfactor and then
      # checks access here with the resulting session cookie (no Proxy-Authorization)
      auth-request:
        implementation: AuthRequest
        authn_strategies:
          - name: CookieSession

# user bans on too many failures
regulation:
  modes:
    - user
  max_retries: 5
  find_time: 15m
  ban_time: 1h

access_control:
  default_policy: deny
  rules:
    # one factor for jellyfin clients to function
    - domain:
        - watch.home.${domain}.${tld}
      subject:
        - group:admins
        - group:jellyfin_users
        - group:jellyfin_admins
      policy: one_factor

    - domain: "*.${domain}.${tld}"
      subject: group:admins
      policy: two_factor

session:
  name: authelia
  secret: {{ secret "/secrets/SESSION_KEY" | msquote }}
  same_site: lax
  expiration: 1h
  inactivity: 5m
  remember_me: 1M
  cookies:
    - domain: ${domain}.${tld}
      authelia_url: https://auth.${domain}.${tld}
  redis:
    host: dragonfly.auth.svc.cluster.local
    port: 6379
    password: {{ secret "/secrets/REDIS_PASSWORD" | msquote }}
    max_retries: 10

ntp:
  # pod uses the node clock
  disable_startup_check: true

storage:
  encryption_key: {{ secret "/secrets/ENCRYPTION_KEY" | msquote }}
  postgres:
    address: tcp://pgcluster-rw.db.svc.cluster.local:5432
    database: authelia
    username: {{ secret "/secrets/POSTGRES_USERNAME" | msquote }}
    password: {{ secret "/secrets/POSTGRES_PASSWORD" | msquote }}

notifier:
  disable_startup_check: false
  smtp:
    address: submission://smtp.resend.com:587
    identifier: ${domain}.${tld}
    sender: Authelia <authelia@notify.jasonpanosso.com>
    subject: "[Authelia] {title}"
    username: resend
    password: {{ secret "/secrets/RESEND_API_KEY" | msquote }}

authentication_backend:
  password_reset:
    disable: false
  password_change:
    disable: true
  ldap:
    implementation: lldap
    address: ldap://lldap.lldap.svc.cluster.local
    base_dn: dc=${domain},dc=${tld}
    additional_users_dn: ou=people
    additional_groups_dn: ou=groups
    user: uid=authelia,ou=people,dc=${domain},dc=${tld}
    password: {{ secret "/secrets/LDAP_PASSWORD" | msquote }}
    users_filter: (&(|({username_attribute}={input})({mail_attribute}={input}))(objectClass=person))
    groups_filter: (member={dn})
    attributes:
      display_name: displayName
      username: uid
      group_name: cn
      mail: mail

totp:
  issuer: ${domain}.${tld}
  skew: 1
  secret_size: 32
  algorithm: SHA1
  digits: 6
  period: 30
  allowed_algorithms: ["SHA1"]
  allowed_digits: [6]
  allowed_periods: [30]

identity_validation:
  reset_password:
    jwt_secret: {{ secret "/secrets/JWT_TOKEN" | msquote }}
    jwt_lifespan: 5 minutes
    jwt_algorithm: HS256

identity_providers:
  oidc:
    hmac_secret: {{ secret "/secrets/OIDC_HMAC_SECRET" | msquote }}
    jwks:
      - algorithm: RS256
        key: {{ secret "/secrets/OIDC_JWKS_PRIVATE_KEY" | mindent 10 "|" | msquote }}
    cors:
      endpoints:
        - authorization
        - token
        - revocation
        - introspection
        - userinfo
      allowed_origins_from_client_redirect_uris: true
    claims_policies:
      default:
        id_token: ['groups', 'email', 'email_verified', 'alt_emails', 'preferred_username', 'name']
    authorization_policies:
      # home assistant creates a user for anyone the client lets through
      admins_two_factor:
        default_policy: deny
        rules:
          - policy: two_factor
            subject: group:admins
    clients:
      - client_id: autobrr
        client_secret: {{ secret "/secrets/OIDC_AUTOBRR_HASHED_SECRET" | mindent 10 "|" | msquote }}
        userinfo_signed_response_alg: none
        claims_policy: default
        public: false
        require_pkce: true
        pkce_challenge_method: S256
        authorization_policy: admins_two_factor
        pre_configured_consent_duration: 1y
        redirect_uris:
          - https://autobrr.${domain}.${tld}/api/auth/oidc/callback
        scopes:
          - openid
          - groups
          - email
          - profile
      - client_id: qui
        client_secret: {{ secret "/secrets/OIDC_QUI_HASHED_SECRET" | mindent 10 "|" | msquote }}
        userinfo_signed_response_alg: none
        claims_policy: default
        public: false
        require_pkce: true
        pkce_challenge_method: S256
        authorization_policy: admins_two_factor
        pre_configured_consent_duration: 1y
        redirect_uris:
          - https://qui.${domain}.${tld}/api/auth/oidc/callback
        scopes:
          - openid
          - groups
          - email
          - profile
      - client_id: bookboss
        client_secret: {{ secret "/secrets/OIDC_BOOKBOSS_HASHED_SECRET" | mindent 10 "|" | msquote }}
        userinfo_signed_response_alg: none
        claims_policy: default
        public: false
        require_pkce: true
        pkce_challenge_method: S256
        authorization_policy: admins_two_factor
        pre_configured_consent_duration: 1y
        redirect_uris:
          - https://books.${domain}.${tld}/auth/oidc/callback
        scopes:
          - openid
          - groups
          - email
          - profile
      # hass-oidc-auth (auth_oidc) custom integration
      - client_id: home-assistant
        client_name: Home Assistant
        client_secret: {{ secret "/secrets/OIDC_HOME_ASSISTANT_HASHED_SECRET" | mindent 10 "|" | msquote }}
        public: false
        require_pkce: true
        pkce_challenge_method: S256
        # auth_oidc sends the secret in the POST body
        token_endpoint_auth_method: client_secret_post
        userinfo_signed_response_alg: none
        claims_policy: default
        authorization_policy: admins_two_factor
        pre_configured_consent_duration: 1y
        redirect_uris:
          - https://hass.${domain}.${tld}/auth/oidc/callback
          - https://hass.home.${domain}.${tld}/auth/oidc/callback
        scopes:
          - openid
          - groups
          - profile
      - client_id: silo
        client_name: Silo
        client_secret: {{ secret "/secrets/OIDC_SILO_HASHED_SECRET" | mindent 10 "|" | msquote }}
        public: false
        require_pkce: true
        pkce_challenge_method: S256
        userinfo_signed_response_alg: none
        claims_policy: default
        authorization_policy: admins_two_factor
        pre_configured_consent_duration: 1y
        redirect_uris:
          # stable callback from silo's plugins.yaml (auth_binding.callback: stable)
          - https://silo.home.${domain}.${tld}/api/v2/auth/oauth/callback
        scopes:
          - openid
          - groups
          - email
          - profile

telemetry:
  metrics:
    enabled: true
    address: tcp://0.0.0.0:9959/metrics
    buffers:
      read: 4096
      write: 4096
    timeouts:
      read: 6s
      write: 6s
      idle: 30s
