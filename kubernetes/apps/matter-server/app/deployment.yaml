---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone/deployment-apps-v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: &app matter-server
  labels:
    app.kubernetes.io/name: *app
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: *app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: *app
      annotations:
        k8s.v1.cni.cncf.io/networks: |-
          [{"name": "iot", "namespace": "kube-system", "interface": "net1", "ips": ["192.168.40.11/24"], "mac": "02:00:00:00:40:11"}]
    spec:
      automountServiceAccountToken: false
      # need vlan40 to access otbr
      nodeSelector:
        network.home.internal/vlan40: "true"
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - image: ghcr.io/matter-js/matterjs-server:1.5.5@sha256:ee149c7c67eff0e90f131e8f0d628f7b099591ec58473c8cda1209e8ae4df66e
          name: *app
          ports:
            - containerPort: 5580
              name: ws
          env:
            - name: TZ
              value: Etc/UTC
            - name: STORAGE_PATH
              value: /data
            - name: PORT
              value: "5580"
            # unauthenticated API: keep it off net1, where cilium policy doesn't apply
            - name: LISTEN_ADDRESS
              value: eth0
            # IoT VLAN interface (multus)
            - name: PRIMARY_INTERFACE
              value: net1
            # dashboard connects to the websocket at the page's own URL (behind the gateway)
            - name: PRODUCTION_MODE
              value: "true"
            # HA bluetooth proxy
            - name: BLE_PROXY
              value: "true"
            # trust test PAAs + test CD signer (dev devices with test DACs)
            - name: ENABLE_TEST_NET_DCL
              value: "true"
            - name: LOG_LEVEL
              value: info
            - name: MATTER_LOG_FORMAT
              value: plain
          livenessProbe: &probes
            tcpSocket:
              port: 5580
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe: *probes
          resources:
            requests:
              cpu: 25m
              memory: 320Mi
            limits:
              memory: 320Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: *app
        - name: tmp
          emptyDir: {}
