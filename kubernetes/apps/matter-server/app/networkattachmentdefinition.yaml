---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/k8s.cni.cncf.io/networkattachmentdefinition_v1.json
# IoT VLAN with the OTBR. IPv6 only (link-local + SLAAC)
# sysctls:
# - accept_ra_rt_info_max_plen=64 installs the OTBR's route to the Thread /64 from its RA route information option
# - accept_ra_defrtr=0 keeps the default route on eth0
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: iot
spec:
  config: |-
    {
      "cniVersion": "1.0.0",
      "name": "iot",
      "plugins": [
        {
          "type": "macvlan",
          "master": "vlan40",
          "mode": "bridge",
          "ipam": {},
          "capabilities": { "mac": true }
        },
        {
          "type": "tuning",
          "sysctl": {
            "net.ipv6.conf.net1.accept_ra": "2",
            "net.ipv6.conf.net1.accept_ra_rt_info_max_plen": "64",
            "net.ipv6.conf.net1.accept_ra_defrtr": "0"
          }
        }
      ]
    }
