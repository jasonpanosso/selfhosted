---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
# dashboard and unauthenticated websocket API share 5580
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: &app matter-server
  labels:
    app.kubernetes.io/name: *app
spec:
  parentRefs:
    - name: cilium
      namespace: kube-system
      sectionName: https
  hostnames:
    - matter.${domain}.${tld}
  rules:
    - filters:
        - type: ExternalAuth
          externalAuth:
            protocol: HTTP
            backendRef:
              name: authelia
              namespace: auth
              port: 80
            http:
              path: /api/authz/ext-authz/
              allowedHeaders:
                - accept
                - cookie
                - x-forwarded-proto
                - x-requested-with
              allowedResponseHeaders:
                - Remote-User
                - Remote-Name
                - Remote-Groups
                - Remote-Email
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-For
                value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
      backendRefs:
        - name: *app
          port: 5580
      timeouts:
        request: 0s
