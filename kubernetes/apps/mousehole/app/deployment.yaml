---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone/deployment-apps-v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: &app mousehole
  labels:
    app.kubernetes.io/name: *app
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: *app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: *app
      annotations:
        k8s.v1.cni.cncf.io/networks: |-
          [{"name": "vpn", "namespace": "kube-system", "interface": "net1", "ips": ["192.168.30.12/24"], "mac": "02:00:00:00:30:12"}]
    spec:
      nodeSelector:
        network.home.internal/vlan30: "true"
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - image: docker.io/tmmrtn/mousehole:0.5.0@sha256:2fc02b12362581e60bfd6adba788bda9eda93f8f31ed089581eeabcee4518b0d
          name: *app
          ports:
            - name: http
              containerPort: 5010
          env:
            - name: MOUSEHOLE_INSECURE_ALLOW_NO_AUTH
              value: "true"
            - name: MOUSEHOLE_ALLOWED_HOSTS
              value: mousehole.${domain}.${tld}
            - name: MOUSEHOLE_ALLOWED_ORIGINS
              value: https://mousehole.${domain}.${tld}
            - name: MOUSEHOLE_STATE_DIR_PATH
              value: /data
          livenessProbe: &probes
            httpGet:
              path: /
              port: 5010
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          readinessProbe: *probes
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: *app
