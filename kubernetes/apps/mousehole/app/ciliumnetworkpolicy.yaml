---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
# only covers eth0. block all egress that is not cluster-local
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mousehole
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: mousehole
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    # cilium gateway envoy
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "5010"
              protocol: TCP
  egress:
    - toEntities:
        - cluster
