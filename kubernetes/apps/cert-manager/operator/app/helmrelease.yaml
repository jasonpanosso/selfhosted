---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app cert-manager
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  upgrade:
    strategy:
      name: RemediateOnFailure
    remediation:
      remediateLastFailure: true
      retries: 2
  values:
    crds:
      enabled: true
    extraArgs:
      - "--enable-certificate-owner-ref=true"
      - "--dns01-recursive-nameservers-only"
      - "--dns01-recursive-nameservers=8.8.8.8:53,1.1.1.1:53"
    resources:
      requests:
        cpu: 10m
        memory: 192Mi
      limits:
        memory: 192Mi
    cainjector:
      resources:
        requests:
          cpu: 10m
          memory: 192Mi
        limits:
          memory: 192Mi
    webhook:
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          memory: 128Mi
    prometheus:
      servicemonitor:
        enabled: true
