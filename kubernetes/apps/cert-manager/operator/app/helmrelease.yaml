---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app cert-manager
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
  rollback:
    cleanupOnFail: true
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    # never roll back: a rollback re-applies this chart's older (templated) CRDs
    strategy:
      name: RetryOnFailure
  values:
    crds:
      enabled: true
    # certificates from annotated Gateways and ListenerSets (per-app TLS)
    config:
      gatewayAPI:
        enabled: true
        enableListenerSet: true
      featureGates:
        # alpha, default off in v1.21
        ListenerSets: true
    extraArgs:
      - "--enable-certificate-owner-ref=true"
      - "--dns01-recursive-nameservers-only"
      - "--dns01-recursive-nameservers=8.8.8.8:53,1.1.1.1:53"
    resources:
      requests:
        cpu: 10m
        memory: 192Mi
      limits:
        memory: 192Mi
    cainjector:
      resources:
        requests:
          cpu: 10m
          memory: 192Mi
        limits:
          memory: 192Mi
    webhook:
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          memory: 128Mi
    prometheus:
      servicemonitor:
        enabled: true
